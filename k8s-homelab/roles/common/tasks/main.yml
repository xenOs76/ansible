---
- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false
  tags:
    - common
    - swap

- name: Disable swap persistently in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\s]+\s+[^#\s]+\s+swap\s+.*)$'
    replace: '# \1'
  tags:
    - common
    - swap

- name: Configure kernel modules for Kubernetes
  ansible.builtin.template:
    src: k8s-modules.conf.j2
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: '0644'
  tags:
    - common
    - modules

- name: Load overlay kernel module
  ansible.builtin.command: modprobe overlay
  changed_when: false
  tags:
    - common
    - modules

- name: Load br_netfilter kernel module
  ansible.builtin.command: modprobe br_netfilter
  changed_when: false
  tags:
    - common
    - modules

- name: Configure sysctl parameters for Kubernetes
  ansible.builtin.template:
    src: k8s-sysctl.conf.j2
    dest: /etc/sysctl.d/k8s.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply sysctl
  tags:
    - common
    - sysctl

- name: Flush handlers to immediately activate sysctl
  ansible.builtin.meta: flush_handlers
  tags:
    - common
    - sysctl

- name: Remove conflicting or legacy repository lists and keyrings
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/docker.gpg
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    - /etc/apt/sources.list.d/kubernetes.list
  tags:
    - common
    - packages

- name: Add OS76 custom APT repository
  ansible.builtin.apt_repository:
    repo: "{{ os76_apt_repo }}"
    state: present
    filename: os76
  when: os76_apt_repo_enabled | default(true)
  tags:
    - common
    - packages

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - socat
      - conntrack
      - jq
      - tar
      - bash-completion
      - nfs-common
    state: present
    update_cache: true
  tags:
    - common
    - packages

- name: Install custom OS76 packages
  ansible.builtin.apt:
    name: "{{ os76_apt_packages }}"
    state: present
  when:
    - os76_apt_repo_enabled | default(true)
    - os76_apt_packages is defined
    - os76_apt_packages | length > 0
  tags:
    - common
    - packages

- name: Upgrade all system packages via APT
  ansible.builtin.apt:
    upgrade: safe
  tags:
    - common
    - packages
    - upgrade
