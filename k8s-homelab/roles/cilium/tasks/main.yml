---
- name: Determine system architecture for Cilium CLI
  ansible.builtin.set_fact:
    cilium_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  tags:
    - cni
    - cilium

- name: Check if Cilium CLI binary is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/cilium
  register: cilium_bin_stat
  tags:
    - cni
    - cilium

- name: Install Cilium CLI
  when: not cilium_bin_stat.stat.exists
  tags:
    - cni
    - cilium
  block:
    - name: Download Cilium CLI archive
      ansible.builtin.unarchive:
        src: >-
          https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}/cilium-linux-{{ cilium_arch }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        mode: '0755'
        creates: /usr/local/bin/cilium

- name: Check if Hubble CLI binary is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/hubble
  register: cilium_hubble_bin_stat
  tags:
    - cni
    - cilium
    - hubble

- name: Install Hubble CLI
  when: not cilium_hubble_bin_stat.stat.exists
  tags:
    - cni
    - cilium
    - hubble
  block:
    - name: Download Hubble CLI archive
      ansible.builtin.unarchive:
        src: >-
          https://github.com/cilium/hubble/releases/download/{{ cilium_hubble_cli_version }}/hubble-linux-{{ cilium_arch }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        mode: '0755'
        creates: /usr/local/bin/hubble

- name: Install Gateway API CRDs for Cilium Gateway controller
  ansible.builtin.command: >-
    kubectl apply --server-side --force-conflicts -f
    https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ cilium_gateway_api_crd_version }}/experimental-install.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: cilium_gateway_api_enabled | bool
  changed_when: false
  tags:
    - cni
    - cilium
    - gateway-api

- name: Check Cilium installation status in cluster
  ansible.builtin.command: cilium status --wait=false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cilium_status_check
  failed_when: false
  changed_when: false
  tags:
    - cni
    - cilium

- name: Install Cilium CNI in cluster
  ansible.builtin.command: >-
    cilium install
    --set cluster.name={{ cluster_name }}
    {% if cilium_kube_proxy_replacement | bool %}
    --set kubeProxyReplacement=true
    --set k8sServiceHost={{ cilium_k8s_service_host }}
    --set k8sServicePort={{ cilium_k8s_service_port }}
    {% endif %}
    {% if cilium_ingress_enabled | bool %}
    --set ingressController.enabled=true
    --set ingressController.default={{ 'true' if (cilium_ingress_default | bool) else 'false' }}
    --set ingressController.loadbalancerMode=shared
    --set ingressController.service.type={{ cilium_ingress_service_type }}
    --set ingressController.service.insecureNodePort={{ cilium_ingress_http_port }}
    --set ingressController.service.secureNodePort={{ cilium_ingress_https_port }}
    {% endif %}
    {% if cilium_gateway_api_enabled | bool %}
    --set gatewayAPI.enabled=true
    {% endif %}
    {{ cilium_install_extra_args }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: cilium_status_check.rc != 0
  changed_when: true
  tags:
    - cni
    - cilium

- name: Check if Cilium Gateway API or Ingress needs upgrade
  ansible.builtin.command: kubectl get gatewayclass cilium
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cilium_gw_class_check
  failed_when: false
  changed_when: false
  when:
    - cilium_status_check.rc == 0
    - cilium_gateway_api_enabled | bool
  tags:
    - cni
    - cilium
    - gateway-api

- name: Upgrade Cilium in cluster to enable Ingress and Gateway API
  ansible.builtin.command: >-
    cilium upgrade --reuse-values
    {% if cilium_kube_proxy_replacement | bool %}
    --set kubeProxyReplacement=true
    --set k8sServiceHost={{ cilium_k8s_service_host }}
    --set k8sServicePort={{ cilium_k8s_service_port }}
    {% endif %}
    {% if cilium_ingress_enabled | bool %}
    --set ingressController.enabled=true
    --set ingressController.default={{ 'true' if (cilium_ingress_default | bool) else 'false' }}
    --set ingressController.loadbalancerMode=shared
    --set ingressController.service.type={{ cilium_ingress_service_type }}
    --set ingressController.service.insecureNodePort={{ cilium_ingress_http_port }}
    --set ingressController.service.secureNodePort={{ cilium_ingress_https_port }}
    {% endif %}
    {% if cilium_gateway_api_enabled | bool %}
    --set gatewayAPI.enabled=true
    {% endif %}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when:
    - cilium_status_check.rc == 0
    - cilium_gateway_api_enabled | bool
    - cilium_gw_class_check.rc != 0
  changed_when: true
  tags:
    - cni
    - cilium
    - gateway-api

- name: Wait for Cilium deployment to be ready
  ansible.builtin.command: >-
    cilium status --wait --wait-duration {{ cilium_wait_duration }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  tags:
    - cni
    - cilium
    - verify

- name: Deploy Cilium GatewayClass and CiliumGatewayClassConfig for NodePort
  when: cilium_gateway_api_enabled | bool
  tags:
    - cni
    - cilium
    - gateway-api
  block:
    - name: Copy Cilium NodePort GatewayClass definition
      ansible.builtin.template:
        src: cilium-nodeport-gatewayclass.yaml.j2
        dest: /etc/kubernetes/cilium-nodeport-gatewayclass.yaml
        mode: '0644'
    - name: Apply Cilium NodePort GatewayClass definition
      ansible.builtin.command: kubectl apply -f /etc/kubernetes/cilium-nodeport-gatewayclass.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

- name: Verify all cluster nodes are in Ready status
  ansible.builtin.command: kubectl get nodes --no-headers
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cilium_nodes_status
  until: >
    cilium_nodes_status.stdout_lines | length >= (groups['k8s_cluster'] | length) and
    'NotReady' not in cilium_nodes_status.stdout
  retries: 20
  delay: 10
  changed_when: false
  tags:
    - cni
    - cilium
    - verify
