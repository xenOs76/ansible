---
# ==============================================================================
# Role Defaults: Rook-Ceph Block Storage Orchestrator
# ==============================================================================

rook_ceph_enabled: true
rook_ceph_version: "v1.15.5"
rook_ceph_helm_repo: "https://charts.rook.io/release"
rook_ceph_namespace: "rook-ceph"
rook_ceph_cluster_name: "rook-ceph"
rook_ceph_image_version: "v19.2.1"

# StorageClass configuration
rook_ceph_storage_class_name: "rook-ceph-block"
rook_ceph_is_default_sc: true
rook_ceph_fs_type: "ext4"
rook_ceph_reclaim_policy: "Delete"
rook_ceph_volume_binding_mode: "Immediate"

# Ceph cluster topology configuration
rook_ceph_mon_count: 1
rook_ceph_mgr_count: 1
rook_ceph_pool_name: "replicapool"
rook_ceph_pool_replicas: 1
rook_ceph_failure_domain: "osd"

# Target node and storage devices (must be raw unformatted block devices)
rook_ceph_storage_node: "{{ inventory_hostname }}"
rook_ceph_devices: []

# Timeouts & health check intervals (in seconds)
rook_ceph_operator_wait_timeout: 180
rook_ceph_cluster_wait_timeout: 300

# Directory for rendered Kubernetes manifests on control plane
rook_ceph_manifests_dir: "/etc/kubernetes/rook-ceph"
