---
- name: Ensure Ceph RBD kernel module is loaded on cluster nodes
  ansible.builtin.command: modprobe rbd
  delegate_to: "{{ item }}"
  loop: "{{ groups['k8s_cluster'] | default(groups['all']) }}"
  changed_when: false
  tags:
    - ceph
    - storage

- name: Persist Ceph RBD kernel module in /etc/modules-load.d/ceph.conf on cluster nodes
  ansible.builtin.copy:
    dest: /etc/modules-load.d/ceph.conf
    content: "rbd\n"
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ item }}"
  loop: "{{ groups['k8s_cluster'] | default(groups['all']) }}"
  tags:
    - ceph
    - storage

- name: Ensure Rook-Ceph manifests directory exists on control plane
  ansible.builtin.file:
    path: "{{ rook_ceph_manifests_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - ceph
    - storage

- name: Add Rook Helm repository
  ansible.builtin.command: helm repo add rook-release {{ rook_ceph_helm_repo }} --force-update
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: rook_ceph_helm_repo_add
  changed_when: "'has been added' in rook_ceph_helm_repo_add.stdout"
  tags:
    - ceph
    - storage

- name: Update Helm repository cache for Rook
  ansible.builtin.command: helm repo update rook-release
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  tags:
    - ceph
    - storage

- name: Render Rook-Ceph operator Helm values
  ansible.builtin.template:
    src: operator-values.yaml.j2
    dest: "{{ rook_ceph_manifests_dir }}/operator-values.yaml"
    owner: root
    group: root
    mode: "0644"
  tags:
    - ceph
    - storage

- name: Install or update Rook-Ceph operator Helm chart
  ansible.builtin.command: >-
    helm upgrade --install {{ rook_ceph_cluster_name }}-operator rook-release/rook-ceph
    --namespace {{ rook_ceph_namespace }}
    --create-namespace
    --version {{ rook_ceph_version }}
    -f {{ rook_ceph_manifests_dir }}/operator-values.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: rook_ceph_operator_install
  changed_when: "'Release' in rook_ceph_operator_install.stdout or 'UPDATED' in rook_ceph_operator_install.stdout"
  tags:
    - ceph
    - storage

- name: Wait for Rook-Ceph operator deployment rollout
  ansible.builtin.command: >-
    kubectl rollout status deployment/rook-ceph-operator
    -n {{ rook_ceph_namespace }}
    --timeout={{ rook_ceph_operator_wait_timeout }}s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  tags:
    - ceph
    - storage

- name: Render CephCluster resource manifest
  ansible.builtin.template:
    src: ceph-cluster.yaml.j2
    dest: "{{ rook_ceph_manifests_dir }}/ceph-cluster.yaml"
    owner: root
    group: root
    mode: "0644"
  when: rook_ceph_devices | length > 0
  tags:
    - ceph
    - storage

- name: Apply CephCluster resource
  ansible.builtin.command: kubectl apply -f {{ rook_ceph_manifests_dir }}/ceph-cluster.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: rook_ceph_devices | length > 0
  register: rook_ceph_cluster_apply
  changed_when: "'created' in rook_ceph_cluster_apply.stdout or 'configured' in rook_ceph_cluster_apply.stdout"
  tags:
    - ceph
    - storage

- name: Provision Ceph RBD block storage
  ansible.builtin.include_tasks: rbd.yml
  when:
    - rook_ceph_devices | length > 0
    - rook_ceph_rbd_enabled | default(true) | bool
  tags:
    - ceph
    - storage
    - ceph_rbd

- name: Provision CephFS shared filesystem
  ansible.builtin.include_tasks: cephfs.yml
  when:
    - rook_ceph_devices | length > 0
    - rook_ceph_cephfs_enabled | default(true) | bool
  tags:
    - ceph
    - storage
    - ceph_fs

- name: Provision CephNFS daemon and export
  ansible.builtin.include_tasks: nfs.yml
  when:
    - rook_ceph_devices | length > 0
    - rook_ceph_nfs_enabled | default(false) | bool
  tags:
    - ceph
    - storage
    - ceph_nfs

- name: Render test-ceph-storage.sh script into user home directory
  ansible.builtin.template:
    src: test-ceph-storage.sh.j2
    dest: "/home/{{ ansible_user | default('vagrant') }}/test-ceph-storage.sh"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  tags:
    - ceph
    - storage

- name: Render check-ceph-status.sh diagnostic script into user home directory
  ansible.builtin.template:
    src: check-ceph-status.sh.j2
    dest: "/home/{{ ansible_user | default('vagrant') }}/check-ceph-status.sh"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  tags:
    - ceph
    - storage

- name: Report unconfigured storage devices
  ansible.builtin.debug:
    msg: >-
      Notice: rook_ceph_devices is empty on {{ rook_ceph_storage_node }}.
      Rook operator is ready, but CephCluster and StorageClass creation is deferred
      until target block devices are configured in group_vars.
  when: rook_ceph_devices | length == 0
  tags:
    - ceph
    - storage
