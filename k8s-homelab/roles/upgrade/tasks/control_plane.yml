---
- name: Update Kubernetes apt repository key for target minor release
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ upgrade_target_k8s_version_major_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"
  tags:
    - upgrade
    - upgrade_control_plane

- name: Update Kubernetes apt repository source to target minor version
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ upgrade_target_k8s_version_major_minor }}/deb/ /"
    state: present
    filename: kubernetes
    update_cache: true
  tags:
    - upgrade
    - upgrade_control_plane

- name: Unhold kubeadm package on control plane
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: install
  tags:
    - upgrade
    - upgrade_control_plane

- name: Update apt cache and install target kubeadm version
  ansible.builtin.apt:
    name: "kubeadm={{ upgrade_target_k8s_version }}"
    state: present
    update_cache: true
  tags:
    - upgrade
    - upgrade_control_plane

- name: Hold kubeadm package on control plane
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: hold
  tags:
    - upgrade
    - upgrade_control_plane

- name: Check kubeadm upgrade plan on primary control plane
  ansible.builtin.command: kubeadm upgrade plan
  register: upgrade_kubeadm_plan_out
  changed_when: false
  when: inventory_hostname == groups['control_plane'][0]
  tags:
    - upgrade
    - upgrade_control_plane

- name: Apply kubeadm upgrade on primary control plane
  ansible.builtin.command: >-
    kubeadm upgrade apply -y "v{{ upgrade_target_k8s_version.split('-')[0] }}"
  register: upgrade_kubeadm_upgrade_out
  changed_when: true
  when: inventory_hostname == groups['control_plane'][0]
  tags:
    - upgrade
    - upgrade_control_plane

- name: Upgrade secondary control plane node via kubeadm upgrade node
  ansible.builtin.command: kubeadm upgrade node
  changed_when: true
  when: inventory_hostname != groups['control_plane'][0]
  tags:
    - upgrade
    - upgrade_control_plane

- name: Unhold kubelet and kubectl packages on control plane
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
    - kubelet
    - kubectl
  tags:
    - upgrade
    - upgrade_control_plane

- name: Install target kubelet and kubectl versions on control plane
  ansible.builtin.apt:
    name:
      - "kubelet={{ upgrade_target_k8s_version }}"
      - "kubectl={{ upgrade_target_k8s_version }}"
    state: present
    update_cache: true
  tags:
    - upgrade
    - upgrade_control_plane

- name: Hold kubelet and kubectl packages on control plane
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubectl
  tags:
    - upgrade
    - upgrade_control_plane

- name: Restart kubelet service on control plane
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: true
  tags:
    - upgrade
    - upgrade_control_plane
