---
- name: Check if user exists on target
  ansible.builtin.getent:
    database: passwd
    key: "{{ current_admin_user }}"
  failed_when: false
  register: control_plane_user_check

- name: Setup user kubeconfig
  when: control_plane_user_check.ansible_facts.getent_passwd[current_admin_user] is defined and current_admin_user != 'root'
  block:
    - name: Get user home directory
      ansible.builtin.set_fact:
        control_plane_user_home: "{{ control_plane_user_check.ansible_facts.getent_passwd[current_admin_user][4] }}"

    - name: Create user .kube directory
      ansible.builtin.file:
        path: "{{ control_plane_user_home }}/.kube"
        state: directory
        owner: "{{ current_admin_user }}"
        group: "{{ current_admin_user }}"
        mode: '0755'

    - name: Copy kubeconfig for user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ control_plane_user_home }}/.kube/config"
        remote_src: true
        owner: "{{ current_admin_user }}"
        group: "{{ current_admin_user }}"
        mode: '0600'

    - name: Remove CKA training reminder MOTD if present
      ansible.builtin.file:
        path: "{{ control_plane_user_home }}/.motd"
        state: absent

    - name: Configure kubectl preference file (kuberc) with interactive deletion
      ansible.builtin.template:
        src: kuberc.j2
        dest: "{{ control_plane_user_home }}/.kube/kuberc"
        owner: "{{ current_admin_user }}"
        group: "{{ current_admin_user }}"
        mode: '0644'

    - name: Ensure kubectl completion and k alias in user .bashrc
      ansible.builtin.blockinfile:
        path: "{{ control_plane_user_home }}/.bashrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK: kubectl completion"
        block: |
          if command -v kubectl >/dev/null 2>&1; then
            source <(kubectl completion bash)
            alias k=kubectl
            complete -o default -F __start_kubectl k
          fi
          export koyaml="--dry-run=client -o yaml"
        owner: "{{ current_admin_user }}"
        group: "{{ current_admin_user }}"
        mode: '0644'
