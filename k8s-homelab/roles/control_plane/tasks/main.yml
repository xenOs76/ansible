---
- name: Check if control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_admin_conf
  tags:
    - always
    - control_plane
    - init
    - certs

- name: Initialize Kubernetes control plane with kubeadm
  ansible.builtin.command: >-
    kubeadm init
    --pod-network-cidr={{ control_plane_pod_network_cidr }}
    --service-cidr={{ control_plane_service_cidr }}
    --apiserver-advertise-address={{ apiserver_advertise_address | default(node_ip) | default(ansible_default_ipv4.address) }}
    {% if control_plane_apiserver_cert_extra_sans | default('') %}
    --apiserver-cert-extra-sans={{ control_plane_apiserver_cert_extra_sans }}
    {% endif %}
    {{ control_plane_kubeadm_init_extra_args }}
  when: not (control_plane_admin_conf.stat.exists | default(false))
  register: control_plane_init_output
  changed_when: true
  tags:
    - control_plane
    - init

- name: Extract Subject Alternative Names from apiserver certificate
  ansible.builtin.shell: >-
    set -o pipefail &&
    openssl x509 -in /etc/kubernetes/pki/apiserver.crt -noout -ext subjectAltName 2>/dev/null
    | grep -v 'X509v3'
    | tr ',' '\n'
    | sed -E 's/^\s*(DNS:|IP Address:|IP:)//g'
    | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
  register: control_plane_apiserver_cert_sans
  changed_when: false
  when: control_plane_admin_conf.stat.exists | default(false)
  tags:
    - control_plane
    - certs

- name: Determine required apiserver certificate SANs
  ansible.builtin.set_fact:
    control_plane_required_sans: >-
      {{
        ((control_plane_apiserver_cert_extra_sans | default('')).split(',') +
         [apiserver_advertise_address | default(node_ip) | default(ansible_default_ipv4.address)])
        | map('trim') | select('truthy') | unique | list
      }}
  when: control_plane_admin_conf.stat.exists | default(false)
  tags:
    - control_plane
    - certs

- name: Regenerate apiserver certificate if required SAN is missing
  when:
    - control_plane_admin_conf.stat.exists | default(false)
    - (control_plane_required_sans | default([]) | difference(control_plane_apiserver_cert_sans.stdout_lines | default([]))) | length > 0
  tags:
    - control_plane
    - certs
  block:
    - name: Backup existing apiserver certificate files
      ansible.builtin.copy:
        src: "/etc/kubernetes/pki/{{ item }}"
        dest: "/etc/kubernetes/pki/{{ item }}.bak"
        remote_src: true
        mode: "0600"
      loop:
        - apiserver.crt
        - apiserver.key

    - name: Remove stale apiserver certificate files
      ansible.builtin.file:
        path: "/etc/kubernetes/pki/{{ item }}"
        state: absent
      loop:
        - apiserver.crt
        - apiserver.key

    - name: Reissue apiserver certificate with updated SANs
      ansible.builtin.command: >-
        kubeadm init phase certs apiserver
        --service-cidr={{ control_plane_service_cidr }}
        --apiserver-advertise-address={{ apiserver_advertise_address | default(node_ip) | default(ansible_default_ipv4.address) }}
        {% if control_plane_apiserver_cert_extra_sans | default('') %}
        --apiserver-cert-extra-sans={{ control_plane_apiserver_cert_extra_sans }}
        {% endif %}
      changed_when: true

    - name: Backup kube-apiserver manifest to trigger static pod termination
      ansible.builtin.copy:
        src: /etc/kubernetes/manifests/kube-apiserver.yaml
        dest: /etc/kubernetes/kube-apiserver.yaml.tmp
        remote_src: true
        mode: "0600"

    - name: Remove kube-apiserver manifest to terminate running static pod
      ansible.builtin.file:
        path: /etc/kubernetes/manifests/kube-apiserver.yaml
        state: absent

    - name: Wait for kube-apiserver port to close
      ansible.builtin.wait_for:
        port: 6443
        state: stopped
        timeout: 30
      failed_when: false

    - name: Restore kube-apiserver manifest to start replacement static pod
      ansible.builtin.copy:
        src: /etc/kubernetes/kube-apiserver.yaml.tmp
        dest: /etc/kubernetes/manifests/kube-apiserver.yaml
        remote_src: true
        mode: "0600"

    - name: Clean up temporary kube-apiserver manifest backup
      ansible.builtin.file:
        path: /etc/kubernetes/kube-apiserver.yaml.tmp
        state: absent

    - name: Wait for kube-apiserver port to become available
      ansible.builtin.wait_for:
        port: 6443
        state: started
        delay: 2
        timeout: 60

    - name: Verify replacement API server is healthy and responsive
      ansible.builtin.command: >-
        kubectl get --raw=/livez --kubeconfig=/etc/kubernetes/admin.conf
      register: control_plane_apiserver_livez
      changed_when: false
      retries: 20
      delay: 3
      until: control_plane_apiserver_livez.rc == 0 and control_plane_apiserver_livez.stdout == 'ok'

- name: Create .kube directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"
  tags:
    - control_plane
    - kubeconfig
    - certs

- name: Copy admin.conf to root kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  tags:
    - control_plane
    - kubeconfig
    - certs

- name: Configure kubeconfig for administrative users
  ansible.builtin.include_tasks: user_kubeconfig.yml
  loop: "{{ control_plane_admin_users }}"
  loop_control:
    loop_var: current_admin_user
  tags:
    - control_plane
    - kubeconfig
    - certs

- name: Generate fresh kubeadm join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: control_plane_join_cmd_raw
  changed_when: false
  tags:
    - control_plane
    - join_token

- name: Set kubeadm join command fact on control plane
  ansible.builtin.set_fact:
    control_plane_join_command: "{{ control_plane_join_cmd_raw.stdout }}"
  tags:
    - control_plane
    - join_token
