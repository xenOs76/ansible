---
control_plane_pod_network_cidr: "{{ pod_network_cidr | default('10.244.0.0/16') }}"
control_plane_service_cidr: "{{ service_cidr | default('10.96.0.0/12') }}"
control_plane_kubeadm_init_extra_args: "{{ kubeadm_init_extra_args | default('') }}"
control_plane_admin_users: "{{ cluster_admin_users | default(['root', ansible_user | default('vagrant'), 'vagrant']) | unique }}"
control_plane_apiserver_cert_extra_sans: >-
  {{ apiserver_cert_extra_sans | default(
       ([ansible_host | default(''), node_ip | default(''), '192.168.56.10',
         ha_control_plane_vip | default(''),
         inventory_hostname, 'kube-control-plane', '127.0.0.1']
        + (ansible_all_ipv4_addresses | default([])))
       | map('trim') | select('truthy') | unique | join(',')
     ) }}

# Automated daily etcd backup
control_plane_etcd_backup_enabled: true
control_plane_etcd_backup_script_path: "/usr/local/bin/etcd-backup.sh"
control_plane_etcd_backup_dir: "/var/lib/etcd-backup"
control_plane_etcd_backup_prefix: "etcd-snapshot-"
control_plane_etcd_backup_retention_days: 7
control_plane_etcd_backup_calendar: "daily"
