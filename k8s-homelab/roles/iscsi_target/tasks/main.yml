---
- name: Load LIO target kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  changed_when: false
  loop:
    - target_core_mod
    - iscsi_target_mod
  tags:
    - iscsi
    - iscsi_target

- name: Install targetcli-fb LIO target package
  ansible.builtin.apt:
    name: targetcli-fb
    state: present
  tags:
    - iscsi
    - iscsi_target

- name: Ensure iSCSI backing store directory exists
  ansible.builtin.file:
    path: "{{ iscsi_target_storage_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - iscsi
    - iscsi_target

- name: Create sparse image backing store files
  ansible.builtin.command:
    cmd: "truncate -s {{ item.size }} {{ iscsi_target_storage_dir }}/{{ item.name }}"
    creates: "{{ iscsi_target_storage_dir }}/{{ item.name }}"
  loop: "{{ iscsi_target_luns }}"
  when:
    - item.type | default('file') == 'file'
    - item.size is defined
  loop_control:
    label: "{{ item.name }} ({{ item.size | default('N/A') }})"
  tags:
    - iscsi
    - iscsi_target

- name: Deploy LIO targetcli configuration script
  ansible.builtin.template:
    src: configure_iscsi_lio.sh.j2
    dest: /usr/local/sbin/configure-iscsi-lio.sh
    owner: root
    group: root
    mode: "0700"
  notify: Apply LIO configuration
  tags:
    - iscsi
    - iscsi_target

- name: Flush handlers to apply LIO configuration immediately
  ansible.builtin.meta: flush_handlers
  tags:
    - iscsi
    - iscsi_target

- name: Ensure LIO target service is enabled and started
  ansible.builtin.systemd:
    name: "{{ iscsi_target_service }}"
    enabled: true
    state: started
  tags:
    - iscsi
    - iscsi_target
