    - {src: "cluster_troubleshooting_02_canary_deployment.yaml.j2", dest: "02-static-pod-recovery/canary-deployment.yaml", mode: "0644"}
    - {src: "cluster_troubleshooting_02_canary_controller.yaml.j2", dest: "02-static-pod-recovery/canary-controller-deployment.yaml", mode: "0644"}
    - {src: "cluster_troubleshooting_02_test_static_pod.sh.j2", dest: "02-static-pod-recovery/test-static-pod-recovery.sh", mode: "0755"}
    - {src: "cluster_troubleshooting_02_guide.md.j2", dest: "02-static-pod-recovery/README.md", mode: "0644"}
