---
- name: Ensure CKA lab secrets and drill directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  loop:
    - "{{ cka_lab_secrets_dir }}"
    - "{{ cka_lab_secrets_dir }}/01-imperative-creation"
    - "{{ cka_lab_secrets_dir }}/02-decode-inspection"
    - "{{ cka_lab_secrets_dir }}/03-env-var-injection"
    - "{{ cka_lab_secrets_dir }}/04-volume-mounts-tls"
    - "{{ cka_lab_secrets_dir }}/05-immutability-drill"
  tags:
    - cka_lab
    - secrets

# --- Default Namespace Certificates and Keys ---

- name: Check if sample TLS certificate and key exist
  ansible.builtin.stat:
    path: "{{ cka_lab_secrets_dir }}/sample-tls.crt"
  register: cka_lab_tls_cert_stat
  tags:
    - cka_lab
    - secrets

- name: Generate self-signed TLS certificate and key for sample-tls-secret
  ansible.builtin.command: >-
    openssl req -x509 -nodes -days 365 -newkey rsa:2048
    -keyout {{ cka_lab_secrets_dir }}/sample-tls.key
    -out {{ cka_lab_secrets_dir }}/sample-tls.crt
    -subj "/CN=sample-service.{{ cka_lab_secrets_default_namespace }}.svc.cluster.local/O=CKA-Lab"
  args:
    creates: "{{ cka_lab_secrets_dir }}/sample-tls.crt"
  when: not cka_lab_tls_cert_stat.stat.exists
  tags:
    - cka_lab
    - secrets

- name: Check if sample SSH private key exists
  ansible.builtin.stat:
    path: "{{ cka_lab_secrets_dir }}/sample-ssh.key"
  register: cka_lab_ssh_key_stat
  tags:
    - cka_lab
    - secrets

- name: Generate sample SSH private key for sample-ssh-auth
  ansible.builtin.command: >-
    ssh-keygen -q -t ed25519 -N "" -C "cka-lab-sample-key" -f {{ cka_lab_secrets_dir }}/sample-ssh.key
  args:
    creates: "{{ cka_lab_secrets_dir }}/sample-ssh.key"
  when: not cka_lab_ssh_key_stat.stat.exists
  tags:
    - cka_lab
    - secrets

# --- Development Namespace Certificates and Keys ---

- name: Check if dev TLS certificate and key exist
  ansible.builtin.stat:
    path: "{{ cka_lab_secrets_dir }}/dev-tls.crt"
  register: cka_lab_dev_tls_cert_stat
  tags:
    - cka_lab
    - secrets

- name: Generate self-signed TLS certificate and key for dev-tls-secret
  ansible.builtin.command: >-
    openssl req -x509 -nodes -days 365 -newkey rsa:2048
    -keyout {{ cka_lab_secrets_dir }}/dev-tls.key
    -out {{ cka_lab_secrets_dir }}/dev-tls.crt
    -subj "/CN=dev-service.{{ cka_lab_secrets_dev_namespace }}.svc.cluster.local/O=CKA-Lab-Dev"
  args:
    creates: "{{ cka_lab_secrets_dir }}/dev-tls.crt"
  when: not cka_lab_dev_tls_cert_stat.stat.exists
  tags:
    - cka_lab
    - secrets

- name: Check if dev SSH private key exists
  ansible.builtin.stat:
    path: "{{ cka_lab_secrets_dir }}/dev-ssh.key"
  register: cka_lab_dev_ssh_key_stat
  tags:
    - cka_lab
    - secrets

- name: Generate dev SSH private key for dev-ssh-auth
  ansible.builtin.command: >-
    ssh-keygen -q -t ed25519 -N "" -C "cka-lab-dev-deploy-key" -f {{ cka_lab_secrets_dir }}/dev-ssh.key
  args:
    creates: "{{ cka_lab_secrets_dir }}/dev-ssh.key"
  when: not cka_lab_dev_ssh_key_stat.stat.exists
  tags:
    - cka_lab
    - secrets

- name: Set permissions on certificate and key files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ cka_lab_secrets_dir }}/sample-tls.crt", mode: "0644"}
    - {path: "{{ cka_lab_secrets_dir }}/sample-tls.key", mode: "0600"}
    - {path: "{{ cka_lab_secrets_dir }}/sample-ssh.key", mode: "0600"}
    - {path: "{{ cka_lab_secrets_dir }}/sample-ssh.key.pub", mode: "0644"}
    - {path: "{{ cka_lab_secrets_dir }}/dev-tls.crt", mode: "0644"}
    - {path: "{{ cka_lab_secrets_dir }}/dev-tls.key", mode: "0600"}
    - {path: "{{ cka_lab_secrets_dir }}/dev-ssh.key", mode: "0600"}
    - {path: "{{ cka_lab_secrets_dir }}/dev-ssh.key.pub", mode: "0644"}
  tags:
    - cka_lab
    - secrets

# --- Read All Generated Secrets Data ---

- name: Read sample TLS certificate
  ansible.builtin.slurp:
    src: "{{ cka_lab_secrets_dir }}/sample-tls.crt"
  register: cka_lab_sample_tls_crt_raw
  tags:
    - cka_lab
    - secrets

- name: Read sample TLS private key
  ansible.builtin.slurp:
    src: "{{ cka_lab_secrets_dir }}/sample-tls.key"
  register: cka_lab_sample_tls_key_raw
  tags:
    - cka_lab
    - secrets

- name: Read sample SSH private key
  ansible.builtin.slurp:
    src: "{{ cka_lab_secrets_dir }}/sample-ssh.key"
  register: cka_lab_sample_ssh_key_raw
  tags:
    - cka_lab
    - secrets

- name: Read dev TLS certificate
  ansible.builtin.slurp:
    src: "{{ cka_lab_secrets_dir }}/dev-tls.crt"
  register: cka_lab_dev_tls_crt_raw
  tags:
    - cka_lab
    - secrets

- name: Read dev TLS private key
  ansible.builtin.slurp:
    src: "{{ cka_lab_secrets_dir }}/dev-tls.key"
  register: cka_lab_dev_tls_key_raw
  tags:
    - cka_lab
    - secrets

- name: Read dev SSH private key
  ansible.builtin.slurp:
    src: "{{ cka_lab_secrets_dir }}/dev-ssh.key"
  register: cka_lab_dev_ssh_key_raw
  tags:
    - cka_lab
    - secrets

# --- Render and Apply Manifests ---

- name: Render Kubernetes sample secrets manifest
  ansible.builtin.template:
    src: secrets.yaml.j2
    dest: "{{ cka_lab_secrets_dir }}/sample-secrets.yaml"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0644"
  tags:
    - cka_lab
    - secrets

- name: Render CKA secrets drill manifests and guides
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cka_lab_secrets_dir }}/{{ item.dest }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: "secrets_readme.md.j2", dest: "README.md", mode: "0644"}
    - {src: "secrets_test_drills.sh.j2", dest: "test-secrets-drills.sh", mode: "0755"}
    - {src: "secrets_01_run_imperative.sh.j2", dest: "01-imperative-creation/run-imperative.sh", mode: "0755"}
    - {src: "secrets_01_db_creds.txt.j2", dest: "01-imperative-creation/db-creds.txt", mode: "0644"}
    - {src: "secrets_02_decode_secrets.sh.j2", dest: "02-decode-inspection/decode-secrets.sh", mode: "0755"}
    - {src: "secrets_03_single_env_pod.yaml.j2", dest: "03-env-var-injection/01-single-secret-env-pod.yaml", mode: "0644"}
    - {src: "secrets_03_bulk_envfrom_pod.yaml.j2", dest: "03-env-var-injection/02-bulk-secret-envfrom-pod.yaml", mode: "0644"}
    - {src: "secrets_04_secure_volume_pod.yaml.j2", dest: "04-volume-mounts-tls/01-secure-volume-pod.yaml", mode: "0644"}
    - {src: "secrets_04_nginx_tls_pod.yaml.j2", dest: "04-volume-mounts-tls/02-nginx-tls-pod.yaml", mode: "0644"}
    - {src: "secrets_04_nginx_tls.conf.j2", dest: "04-volume-mounts-tls/nginx-tls.conf", mode: "0644"}
    - {src: "secrets_05_immutable_secret.yaml.j2", dest: "05-immutability-drill/immutable-secret.yaml", mode: "0644"}
    - {src: "secrets_05_test_immutability.sh.j2", dest: "05-immutability-drill/test-immutability.sh", mode: "0755"}
  loop_control:
    label: "secrets/{{ item.dest }}"
  tags:
    - cka_lab
    - secrets

- name: Apply sample secrets manifest to Kubernetes cluster
  ansible.builtin.command: >-
    kubectl apply -f {{ cka_lab_secrets_dir }}/sample-secrets.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cka_lab_apply_secrets
  changed_when: "'created' in cka_lab_apply_secrets.stdout or 'configured' in cka_lab_apply_secrets.stdout"
  tags:
    - cka_lab
    - secrets

# --- Verification ---

- name: Verify secrets exist in default namespace
  ansible.builtin.command: >-
    kubectl get secret {{ item }} -n {{ cka_lab_secrets_default_namespace }} -o name
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  loop:
    - sample-app-secret
    - sample-basic-auth
    - sample-tls-secret
    - sample-ssh-auth
  register: cka_lab_verify_default_secrets
  changed_when: false
  tags:
    - cka_lab
    - secrets

- name: Verify secrets exist in development namespace
  ansible.builtin.command: >-
    kubectl get secret {{ item }} -n {{ cka_lab_secrets_dev_namespace }} -o name
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  loop:
    - dev-app-secret
    - dev-basic-auth
    - dev-tls-secret
    - dev-ssh-auth
  register: cka_lab_verify_dev_secrets
  changed_when: false
  tags:
    - cka_lab
    - secrets
