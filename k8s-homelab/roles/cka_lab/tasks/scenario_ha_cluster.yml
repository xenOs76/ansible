---
- name: Ensure CKA lab ha_cluster directory exists
  ansible.builtin.file:
    path: "{{ cka_lab_ha_cluster_dir }}"
    state: directory
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  tags:
    - cka_lab
    - ha_cluster

- name: Render CKA ha_cluster drill manifests and guides
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cka_lab_ha_cluster_dir }}/{{ item.dest }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: "ha_cluster_readme.md.j2", dest: "README.md", mode: "0644"}
    - {src: "ha_cluster_01_verify_vip.sh.j2", dest: "01-verify-vip.sh", mode: "0755"}
    - {src: "ha_cluster_02_etcd_quorum.sh.j2", dest: "02-etcd-quorum.sh", mode: "0755"}
    - {src: "ha_cluster_03_simulate_failover.sh.j2", dest: "03-simulate-failover.sh", mode: "0755"}
    - {src: "ha_cluster_04_upgrade_sequence.sh.j2", dest: "04-ha-upgrade-sequence.sh", mode: "0755"}
    - {src: "ha_cluster_test_drills.sh.j2", dest: "test-ha-drills.sh", mode: "0755"}
  loop_control:
    label: "ha_cluster/{{ item.dest }}"
  tags:
    - cka_lab
    - ha_cluster
