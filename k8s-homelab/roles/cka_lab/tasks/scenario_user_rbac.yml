---
- name: Execute CKA Lab User & PKI Account Setup
  ansible.builtin.include_tasks: scenario_user_rbac_account.yml
  when: not (cka_lab_docs_only | default(false) | bool)
  tags:
    - cka_lab
    - user_rbac

- name: Ensure CKA lab RBAC directory exists
  ansible.builtin.file:
    path: "{{ cka_lab_rbac_dir }}"
    state: directory
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  tags:
    - cka_lab
    - user_rbac
    - rbac

- name: Render create-user-context script and README into CKA rbac directory
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cka_lab_rbac_dir }}/{{ item.dest }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: "rbac_create_user_context.sh.j2", dest: "create-user-context.sh", mode: "0755"}
    - {src: "rbac_readme.md.j2", dest: "README.md", mode: "0644"}
  loop_control:
    label: "rbac/{{ item.dest }}"
  tags:
    - cka_lab
    - user_rbac
    - rbac

- name: Create convenience symlink for create-user-context.sh in cka root directory
  ansible.builtin.file:
    src: "{{ cka_lab_rbac_dir }}/create-user-context.sh"
    dest: "{{ cka_lab_base_dir }}/create-user-context.sh"
    state: link
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
  tags:
    - cka_lab
    - user_rbac
    - rbac

- name: Validate syntax of create-user-context.sh
  ansible.builtin.command: >-
    bash -n {{ cka_lab_rbac_dir }}/create-user-context.sh
  register: cka_lab_rbac_syntax_check
  changed_when: false
  tags:
    - cka_lab
    - user_rbac
    - rbac
- name: Ensure manual user RBAC directory exists
  ansible.builtin.file:
    path: "{{ cka_lab_rbac_manual_dir }}"
    state: directory
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  tags:
    - cka_lab
    - user_rbac
    - rbac

- name: Render manual user RBAC drill manifests, guides, and validation scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cka_lab_rbac_manual_dir }}/{{ item.dest }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: "rbac_manual_readme.md.j2", dest: "README.md", mode: "0644"}
    - {src: "rbac_manual_csr_template.yaml.j2", dest: "csr-template.yaml", mode: "0644"}
    - {src: "rbac_manual_verify.sh.j2", dest: "verify-manual-user.sh", mode: "0755"}
    - {src: "rbac_manual_cleanup.sh.j2", dest: "cleanup-manual-user.sh", mode: "0755"}
  loop_control:
    label: "rbac/manual-user/{{ item.dest }}"
  tags:
    - cka_lab
    - user_rbac
    - rbac

- name: Validate syntax of manual user drill scripts
  ansible.builtin.command: >-
    bash -n {{ cka_lab_rbac_manual_dir }}/{{ item }}
  loop:
    - verify-manual-user.sh
    - cleanup-manual-user.sh
  register: cka_lab_rbac_manual_syntax_check
  changed_when: false
  tags:
    - cka_lab
    - user_rbac
    - rbac

- name: Ensure ServiceAccount RBAC directory exists
  ansible.builtin.file:
    path: "{{ cka_lab_rbac_dir }}/serviceaccounts"
    state: directory
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  tags:
    - cka_lab
    - user_rbac
    - rbac

- name: Render ServiceAccount RBAC manifests and guides
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cka_lab_rbac_dir }}/serviceaccounts/{{ item.dest }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: "rbac_sa_guide.md.j2", dest: "README.md", mode: "0644"}
    - {src: "rbac_sa_drill.yaml.j2", dest: "sa-rbac-drill.yaml", mode: "0644"}
    - {src: "rbac_sa_test.sh.j2", dest: "test-sa-rbac.sh", mode: "0755"}
  loop_control:
    label: "rbac/serviceaccounts/{{ item.dest }}"
  tags:
    - cka_lab
    - user_rbac
    - rbac

- name: Ensure In-Pod API Access drill directory exists
  ansible.builtin.file:
    path: "{{ cka_lab_rbac_api_dir }}"
    state: directory
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  tags:
    - cka_lab
    - user_rbac
    - rbac
    - api_access

- name: Render In-Pod API Access drill manifests, guides, and scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cka_lab_rbac_api_dir }}/{{ item.dest }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: "rbac_api_access_guide.md.j2", dest: "README.md", mode: "0644"}
    - {src: "rbac_api_reader_rbac.yaml.j2", dest: "01-rbac.yaml", mode: "0644"}
    - {src: "rbac_api_sample_secrets.yaml.j2", dest: "02-sample-data.yaml", mode: "0644"}
    - {src: "rbac_api_inspector_pod.yaml.j2", dest: "03-inspector-pod.yaml", mode: "0644"}
    - {src: "rbac_api_exec_inspector.sh.j2", dest: "exec-inspector.sh", mode: "0755"}
    - {src: "rbac_test_api_access.sh.j2", dest: "test-api-access.sh", mode: "0755"}
  loop_control:
    label: "rbac/03-api-access/{{ item.dest }}"
  tags:
    - cka_lab
    - user_rbac
    - rbac
    - api_access

- name: Validate syntax of In-Pod API Access drill scripts
  ansible.builtin.command: >-
    bash -n {{ cka_lab_rbac_api_dir }}/{{ item }}
  loop:
    - exec-inspector.sh
    - test-api-access.sh
  register: cka_lab_rbac_api_syntax_check
  changed_when: false
  tags:
    - cka_lab
    - user_rbac
    - rbac
    - api_access
