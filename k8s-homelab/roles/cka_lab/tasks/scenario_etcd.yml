---
- name: Ensure CKA lab etcd directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  loop:
    - "{{ cka_lab_etcd_dir }}"
    - "{{ cka_lab_etcd_dir }}/01-backup-restore"
  tags:
    - cka_lab
    - etcd

- name: Render CKA etcd drill manifests and guides
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cka_lab_etcd_dir }}/{{ item.dest }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: "etcd_readme.md.j2", dest: "README.md", mode: "0644"}
    - {src: "etcd_test_drills.sh.j2", dest: "test-etcd-drills.sh", mode: "0755"}
    - {src: "etcd_01_backup.sh.j2", dest: "01-backup-restore/backup-etcd.sh", mode: "0755"}
    - {src: "etcd_01_restore.sh.j2", dest: "01-backup-restore/restore-etcd.sh", mode: "0755"}
    - {src: "etcd_01_simulate_loss.sh.j2", dest: "01-backup-restore/simulate-loss-drill.sh", mode: "0755"}
  loop_control:
    label: "etcd/{{ item.dest }}"
  tags:
    - cka_lab
    - etcd
