---
- name: Verify Kubernetes cluster admin.conf exists on control plane
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: cka_lab_admin_conf_stat
  when: not (cka_lab_docs_only | default(false) | bool)
  tags:
    - always
    - cka_lab

- name: Determine cluster initialization state
  ansible.builtin.set_fact:
    cka_lab_cluster_initialized: >-
      {{
        false if (cka_lab_docs_only | default(false) | bool)
        else (cka_lab_admin_conf_stat.stat.exists | default(false))
      }}
  tags:
    - always
    - cka_lab

- name: Announce cluster initialization state
  ansible.builtin.debug:
    msg: >-
      {{
        'Cluster is online on ' ~ inventory_hostname ~ '. Synchronizing standalone CKA lab files into ' ~ cka_lab_base_dir ~ '.'
        if cka_lab_cluster_initialized | bool
        else (
          'Cluster is UNINITIALIZED on ' ~ inventory_hostname ~
          '. Synchronizing standalone CKA lab files into ' ~ cka_lab_base_dir ~ '.'
        )
      }}
  tags:
    - always
    - cka_lab

- name: Execute CKA Lab Scenario - Initial Steps Reminder MOTD (motd)
  ansible.builtin.include_tasks: scenario_motd.yml
  when:
    - cka_lab_scenario_motd_enabled | default(true) | bool
    - not (cka_lab_docs_only | default(false) | bool)
  tags:
    - cka_lab
    - motd

- name: Execute CKA Lab Scenario - Inter-Node DNS & Passwordless SSH (inter_node_ssh)
  ansible.builtin.include_tasks: scenario_inter_node_ssh.yml
  when:
    - cka_lab_scenario_inter_node_ssh_enabled | default(true) | bool
    - not (cka_lab_docs_only | default(false) | bool)
  tags:
    - cka_lab
    - inter_node_ssh
    - cka_ssh

- name: Execute CKA Lab User & PKI Account Setup (user_rbac)
  ansible.builtin.include_tasks: scenario_user_rbac_account.yml
  when:
    - cka_lab_scenario_user_rbac_enabled | default(true) | bool
    - not (cka_lab_docs_only | default(false) | bool)
    - cka_lab_cluster_initialized | default(false) | bool
  tags:
    - cka_lab
    - user_rbac

- name: Ensure git and rsync packages are installed
  ansible.builtin.apt:
    name:
      - git
      - rsync
    state: present
  tags:
    - cka_lab

- name: Ensure CKA lab base directory exists
  ansible.builtin.file:
    path: "{{ cka_lab_base_dir }}"
    state: directory
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  tags:
    - cka_lab

- name: Check if local os76-cka-lab repository exists on Ansible controller
  ansible.builtin.stat:
    path: "{{ cka_lab_local_source_dir }}"
  register: cka_lab_local_repo_stat
  delegate_to: localhost
  become: false
  tags:
    - cka_lab

- name: Synchronize standalone CKA lab files from local repository
  ansible.posix.synchronize:
    src: "{{ cka_lab_local_source_dir }}/"
    dest: "{{ cka_lab_base_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=ckalab.env"
  become: false
  when: cka_lab_local_repo_stat.stat.exists | default(false)
  tags:
    - cka_lab

- name: Clone standalone os76-cka-lab repository from Gitea if local source not found
  ansible.builtin.git:
    repo: "{{ cka_lab_git_repo }}"
    dest: "{{ cka_lab_base_dir }}"
    version: "{{ cka_lab_git_version | default('main') }}"
    force: false
  when: not (cka_lab_local_repo_stat.stat.exists | default(false))
  tags:
    - cka_lab

- name: Ensure correct ownership of CKA lab files
  ansible.builtin.file:
    path: "{{ cka_lab_base_dir }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    recurse: true
  tags:
    - cka_lab

- name: Ensure executable permissions on ckalab runner
  ansible.builtin.file:
    path: "{{ cka_lab_base_dir }}/ckalab"
    mode: "0755"
  failed_when: false
  tags:
    - cka_lab

- name: Ensure executable permissions on cka scripts
  ansible.builtin.file:
    path: "{{ cka_lab_base_dir }}/scripts"
    mode: "0755"
    recurse: true
  failed_when: false
  tags:
    - cka_lab
