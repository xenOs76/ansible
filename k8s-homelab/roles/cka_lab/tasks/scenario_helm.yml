---
- name: Ensure CKA lab helm directory exists
  ansible.builtin.file:
    path: "{{ cka_lab_helm_dir }}"
    state: directory
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  tags:
    - cka_lab
    - helm

- name: Remove legacy install-kube-metrics.sh from vagrant home if present
  ansible.builtin.file:
    path: "/home/{{ ansible_user | default('vagrant') }}/install-kube-metrics.sh"
    state: absent
  tags:
    - cka_lab
    - helm

- name: Render Helm practice scripts into vagrant home directory
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cka_lab_helm_dir }}/{{ item.dest }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: "helm_readme.md.j2", dest: "README.md", mode: "0644"}
    - {src: "helm_install_kube_metrics.sh.j2", dest: "install-kube-metrics.sh", mode: "0755"}
    - {src: "helm_install_kube_prometheus.sh.j2", dest: "install-kube-prometheus.sh", mode: "0755"}
    - {src: "helm_install_nginx_gateway_fabric.sh.j2", dest: "install-nginx-gateway-fabric.sh", mode: "0755"}
  loop_control:
    label: "helm/{{ item.dest }}"
  tags:
    - cka_lab
    - helm

- name: Validate syntax of deployed Helm scripts
  ansible.builtin.command: >-
    bash -n {{ cka_lab_helm_dir }}/{{ item }}
  loop:
    - install-kube-metrics.sh
    - install-kube-prometheus.sh
    - install-nginx-gateway-fabric.sh
  register: cka_lab_helm_syntax_check
  changed_when: false
  tags:
    - cka_lab
    - helm
