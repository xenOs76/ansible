---
- name: Ensure CKA lab jsonpath drill directory exists
  ansible.builtin.file:
    path: "{{ cka_lab_jsonpath_dir }}"
    state: directory
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  tags:
    - cka_lab
    - jsonpath

- name: Render CKA jsonpath drill challenges and evaluation scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cka_lab_jsonpath_dir }}/{{ item.dest }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: "jsonpath_readme.md.j2", dest: "README.md", mode: "0644"}
    - {src: "jsonpath_challenges.md.j2", dest: "challenges.md", mode: "0644"}
    - {src: "jsonpath_solutions.md.j2", dest: "solutions.md", mode: "0644"}
    - {src: "jsonpath_eval.sh.j2", dest: "eval-jsonpath.sh", mode: "0755"}
  loop_control:
    label: "jsonpath/{{ item.dest }}"
  tags:
    - cka_lab
    - jsonpath
