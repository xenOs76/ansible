---
- name: Ensure CKA lab storage classes directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  loop:
    - "{{ cka_lab_storage_classes_dir }}"
    - "{{ cka_lab_storage_classes_dir }}/01-provisioners"
    - "{{ cka_lab_storage_classes_dir }}/02-storage-classes"
  tags:
    - cka_lab
    - storage_classes
    - storage
    - pvc
    - provisioner

- name: Render CKA storage classes drill manifests and guides
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cka_lab_storage_classes_dir }}/{{ item.dest }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: "storage_classes_readme.md.j2", dest: "README.md", mode: "0644"}
    - {src: "storage_classes_test_drills.sh.j2", dest: "test-storage-classes-drills.sh", mode: "0755"}
    - {src: "storage_classes_01_install_provisioner.sh.j2", dest: "01-provisioners/install-local-path-provisioner.sh", mode: "0755"}
    - {src: "storage_classes_02_sc_retain.yaml.j2", dest: "02-storage-classes/cka-lab-sc-retain.yaml"}
    - {src: "storage_classes_02_sc_delete_wait.yaml.j2", dest: "02-storage-classes/cka-lab-sc-delete-wait.yaml"}
    - {src: "storage_classes_03_dynamic_pvc.yaml.j2", dest: "02-storage-classes/cka-lab-dynamic-pvc.yaml"}
    - {src: "storage_classes_03_consumer_pod.yaml.j2", dest: "02-storage-classes/cka-lab-consumer-pod.yaml"}
    - {src: "storage_classes_02_test_storage.sh.j2", dest: "02-storage-classes/test-storage-classes.sh", mode: "0755"}
    - {src: "storage_classes_04_nfs_csi_sc.yaml.j2", dest: "02-storage-classes/03-nfs-csi-sc.yaml"}
    - {src: "storage_classes_04_nfs_dynamic_pvc.yaml.j2", dest: "02-storage-classes/04-nfs-dynamic-pvc.yaml"}
    - {src: "storage_classes_05_nfs_shared_deployment.yaml.j2", dest: "02-storage-classes/05-nfs-shared-deployment.yaml"}
    - {src: "storage_classes_06_test_nfs_csi.sh.j2", dest: "02-storage-classes/test-nfs-csi-drills.sh", mode: "0755"}
  loop_control:
    label: "storage_classes/{{ item.dest }}"
  tags:
    - cka_lab
    - storage_classes
    - storage
    - pvc
    - provisioner

- name: Create symlink for install-nfs-csi-driver.sh in storage classes provisioners directory
  ansible.builtin.file:
    src: "{{ cka_lab_helm_dir }}/install-nfs-csi-driver.sh"
    dest: "{{ cka_lab_storage_classes_dir }}/01-provisioners/install-nfs-csi-driver.sh"
    state: link
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
  tags:
    - cka_lab
    - storage_classes
    - storage
    - provisioner

- name: Create symlink for dynamic NFS CSI drills in volumes directory
  ansible.builtin.file:
    src: "{{ cka_lab_storage_classes_dir }}/02-storage-classes"
    dest: "{{ cka_lab_volumes_dir }}/08-nfs-csi"
    state: link
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
  when: cka_lab_scenario_volumes_enabled | default(true) | bool
  tags:
    - cka_lab
    - storage_classes
    - volumes
    - storage

- name: Validate syntax of storage classes shell scripts
  ansible.builtin.command: >-
    bash -n {{ cka_lab_storage_classes_dir }}/{{ item }}
  loop:
    - test-storage-classes-drills.sh
    - 01-provisioners/install-local-path-provisioner.sh
    - 02-storage-classes/test-storage-classes.sh
    - 02-storage-classes/test-nfs-csi-drills.sh
  register: cka_lab_storage_classes_syntax_check
  changed_when: false
  tags:
    - cka_lab
    - storage_classes
    - storage
