---
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - cka_lab
    - glow
    - tools

- name: Check if Charm keyring already exists
  ansible.builtin.stat:
    path: "{{ cka_lab_glow_apt_keyring }}"
  register: cka_lab_glow_keyring_stat
  tags:
    - cka_lab
    - glow
    - tools

- name: Setup Charm official APT repository signing key
  when: not cka_lab_glow_keyring_stat.stat.exists
  tags:
    - cka_lab
    - glow
    - tools
  block:
    - name: Download Charm repository GPG key
      ansible.builtin.get_url:
        url: "{{ cka_lab_glow_apt_key_url }}"
        dest: /tmp/charm-raw.gpg
        mode: "0644"

    - name: Extract primary key count from downloaded Charm key
      ansible.builtin.shell: >-
        set -o pipefail &&
        gpg --show-keys --with-colons /tmp/charm-raw.gpg | grep -c '^pub:'
      args:
        executable: /bin/bash
      register: cka_lab_glow_pub_count
      changed_when: false

    - name: Extract primary key fingerprint from downloaded Charm key
      ansible.builtin.shell: >-
        set -o pipefail &&
        gpg --show-keys --with-colons /tmp/charm-raw.gpg | awk -F: '$1 == "pub" {getline; if ($1 == "fpr") print $10}'
      args:
        executable: /bin/bash
      register: cka_lab_glow_key_fpr
      changed_when: false

    - name: Validate Charm GPG key contains only the pinned primary key
      ansible.builtin.assert:
        that:
          - cka_lab_glow_pub_count.stdout | int == 1
          - cka_lab_glow_key_fpr.stdout == cka_lab_glow_apt_key_fingerprint
        fail_msg: >-
          Downloaded Charm key response is invalid: found {{ cka_lab_glow_pub_count.stdout }} primary keys
          with fingerprint '{{ cka_lab_glow_key_fpr.stdout }}'
          (expected 1 key matching '{{ cka_lab_glow_apt_key_fingerprint }}').

    - name: Dearmor Charm GPG key into {{ cka_lab_glow_apt_keyring }}
      ansible.builtin.command:
        cmd: "gpg --dearmor -o {{ cka_lab_glow_apt_keyring }} /tmp/charm-raw.gpg"
      changed_when: true

    - name: Ensure Charm keyring file permissions
      ansible.builtin.file:
        path: "{{ cka_lab_glow_apt_keyring }}"
        owner: root
        group: root
        mode: "0644"

    - name: Clean up temporary raw key
      ansible.builtin.file:
        path: /tmp/charm-raw.gpg
        state: absent

- name: Add Charm official APT repository
  ansible.builtin.apt_repository:
    repo: "{{ cka_lab_glow_apt_repo }}"
    state: present
    filename: charm
  tags:
    - cka_lab
    - glow
    - tools

- name: Install glow package via APT
  ansible.builtin.apt:
    name: glow
    state: present
    update_cache: true
  tags:
    - cka_lab
    - glow
    - tools
