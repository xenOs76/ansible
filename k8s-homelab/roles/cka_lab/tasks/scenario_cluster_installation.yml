---
- name: Ensure CKA lab cluster installation directory exists
  ansible.builtin.file:
    path: "{{ cka_lab_cluster_installation_dir }}"
    state: directory
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "0755"
  tags:
    - cka_lab
    - cluster_installation
    - installation

- name: Render CKA cluster installation drill manifests and guides
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cka_lab_cluster_installation_dir }}/{{ item.dest }}"
    owner: "{{ ansible_user | default('vagrant') }}"
    group: "{{ ansible_user | default('vagrant') }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: "cluster_installation_readme.md.j2", dest: "README.md", mode: "0644"}
    - {src: "cluster_install_01_init.sh.j2", dest: "01-kubeadm-init.sh", mode: "0755"}
    - {src: "cluster_install_01_ha_init.sh.j2", dest: "01-ha-kubeadm-init.sh", mode: "0755"}
    - {src: "cluster_install_02_cni_cilium.sh.j2", dest: "02-install-cni-cilium.sh", mode: "0755"}
    - {src: "cluster_install_02_cni_calico.sh.j2", dest: "02-install-cni-calico.sh", mode: "0755"}
    - {src: "cluster_install_03_join_workers.sh.j2", dest: "03-join-workers.sh", mode: "0755"}
    - {src: "cluster_install_test_drills.sh.j2", dest: "test-cluster-install.sh", mode: "0755"}
  loop_control:
    label: "cluster_installation/{{ item.dest }}"
  tags:
    - cka_lab
    - cluster_installation
    - installation
