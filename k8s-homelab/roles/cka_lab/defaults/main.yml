---
# Scenario toggles
cka_lab_scenario_motd_enabled: true
cka_lab_scenario_inter_node_ssh_enabled: true
cka_lab_scenario_user_rbac_enabled: true
cka_lab_scenario_chaos_troubleshooting_enabled: false

# Root CKA directory & generation modes
cka_lab_base_dir: "/home/{{ ansible_user | default('vagrant') }}/cka"
cka_lab_docs_only: false

# Standalone os76-cka-lab repository synchronization
cka_lab_local_source_dir: "/home/xeno/git/gitea/os76-cka-lab"
cka_lab_git_repo: "https://git.priv.os76.xyz/xeno/os76-cka-lab.git"
cka_lab_git_version: "main"

# Scenario: inter_node_ssh (Inter-Node DNS Resolution & Passwordless SSH for CKA Drills)
cka_lab_inter_node_ssh_user: "{{ ansible_user | default('vagrant') }}"
cka_lab_inter_node_ssh_key_path: "/home/{{ cka_lab_inter_node_ssh_user }}/.ssh/id_ed25519"

# Scenario: motd (CKA Initial Steps Reminder Announcement)
cka_lab_motd_user: "{{ ansible_user | default('vagrant') }}"
cka_lab_motd_file: "/home/{{ ansible_user | default('vagrant') }}/.motd"
cka_lab_update_motd_hook: "/etc/update-motd.d/99-cka-training"

# Scenario: user_rbac (User Authentication & RBAC Drill)
cka_lab_user_rbac_name: "anna"
cka_lab_user_rbac_shell: "/bin/bash"
cka_lab_user_rbac_groups:
  - sudo
cka_lab_user_rbac_passwordless_sudo: true

# Kubernetes PKI & CA configuration
cka_lab_k8s_ca_crt: "/etc/kubernetes/pki/ca.crt"

# User 'anna' certificate & context attributes
cka_lab_user_rbac_cert_dir: "/home/{{ cka_lab_user_rbac_name }}/certs"
cka_lab_user_rbac_kube_dir: "/home/{{ cka_lab_user_rbac_name }}/.kube"
cka_lab_user_rbac_csr_expiration_seconds: 86400
cka_lab_user_rbac_k8s_group: "developers"
cka_lab_user_rbac_cluster_name: "kubernetes"
cka_lab_user_rbac_cluster_server: "https://127.0.0.1:6443"
cka_lab_user_rbac_context_name: "{{ cka_lab_user_rbac_name }}@kubernetes"
