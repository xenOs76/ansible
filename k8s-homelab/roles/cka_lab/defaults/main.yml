---
# Scenario toggles (organized by CKA exam domain)
cka_lab_scenario_motd_enabled: true
cka_lab_scenario_user_rbac_enabled: true
cka_lab_scenario_secrets_enabled: true
cka_lab_scenario_configmaps_enabled: true
cka_lab_scenario_helm_enabled: true
cka_lab_scenario_volumes_enabled: true
cka_lab_scenario_deployments_enabled: true
cka_lab_scenario_pods_enabled: true
cka_lab_scenario_networking_enabled: true
cka_lab_scenario_scheduling_enabled: true
cka_lab_scenario_workloads_advanced_enabled: true
cka_lab_scenario_storage_classes_enabled: true
cka_lab_scenario_cluster_troubleshooting_enabled: true
cka_lab_scenario_crds_enabled: true
cka_lab_scenario_chaos_troubleshooting_enabled: false

# Scenario: motd (CKA Initial Steps Reminder Announcement)
cka_lab_motd_user: "{{ ansible_user | default('vagrant') }}"
cka_lab_motd_file: "/home/{{ ansible_user | default('vagrant') }}/.motd"
cka_lab_update_motd_hook: "/etc/update-motd.d/99-cka-training"

# Scenario: user_rbac (User Authentication & RBAC Drill)
cka_lab_user_rbac_name: "anna"
cka_lab_user_rbac_shell: "/bin/bash"
cka_lab_user_rbac_groups:
  - sudo
cka_lab_user_rbac_passwordless_sudo: true

# Kubernetes PKI & CA configuration
cka_lab_k8s_ca_crt: "/etc/kubernetes/pki/ca.crt"

# User 'anna' certificate & context attributes
cka_lab_user_rbac_cert_dir: "/home/{{ cka_lab_user_rbac_name }}/certs"
cka_lab_user_rbac_kube_dir: "/home/{{ cka_lab_user_rbac_name }}/.kube"
cka_lab_user_rbac_csr_expiration_seconds: 86400
cka_lab_user_rbac_k8s_group: "developers"
cka_lab_user_rbac_cluster_name: "kubernetes"
cka_lab_user_rbac_cluster_server: "https://127.0.0.1:6443"
cka_lab_user_rbac_context_name: "{{ cka_lab_user_rbac_name }}@kubernetes"

# Vagrant user context creation script settings
# Reference: https://github.com/bmuschko/cka-crash-course/blob/master/exercises/04-rbac/create-user-context.sh
cka_lab_rbac_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/rbac"
cka_lab_rbac_user: "{{ ansible_user | default('vagrant') }}"
cka_lab_rbac_csr_expiration_seconds: 86400

# Scenario: secrets (Kubernetes Secrets Drill)
# Reference: https://kubernetes.io/docs/concepts/configuration/secret/
cka_lab_secrets_default_namespace: "default"
cka_lab_secrets_dev_namespace: "development"
cka_lab_secrets_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/secrets"

# Default namespace secret parameters
cka_lab_secret_opaque_username: "appadmin"
cka_lab_secret_opaque_password: "AppSuperSecretPassword123!"
cka_lab_secret_opaque_db_url: "postgresql://appadmin:AppSuperSecretPassword123!@postgres.default.svc.cluster.local:5432/appdb"
cka_lab_secret_opaque_api_key: "sample-dummy-api-key-test-value"
cka_lab_secret_basic_username: "admin"
cka_lab_secret_basic_password: "t0p-Secret-BasicAuth-Password"

# Development namespace secret parameters
cka_lab_dev_secret_opaque_username: "devadmin"
cka_lab_dev_secret_opaque_password: "DevSecretPass2026!"
cka_lab_dev_secret_opaque_db_url: "postgresql://devadmin:DevSecretPass2026!@postgres.development.svc.cluster.local:5432/devdb"
cka_lab_dev_secret_opaque_api_key: "dev-dummy-api-key-test-value"
cka_lab_dev_secret_opaque_jwt: "dev-jwt-signing-secret-key-32b"
cka_lab_dev_secret_basic_username: "dev-user"
cka_lab_dev_secret_basic_password: "DevAuthPass#456"

# Scenario: configmaps (Kubernetes ConfigMaps Drill)
# Reference: https://kubernetes.io/docs/concepts/configuration/configmap/
cka_lab_configmaps_default_namespace: "default"
cka_lab_configmaps_dev_namespace: "development"
cka_lab_configmaps_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/configmaps"
cka_lab_kustomize_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/kustomize"

cka_lab_configmaps_definitions:
  - namespace: "{{ cka_lab_configmaps_default_namespace }}"
    configmaps:
      - name: sample-app-config
        labels:
          app.kubernetes.io/part-of: cka-lab
          cka.practice/scenario: configmaps
        data:
          APP_ENV: "production"
          LOG_LEVEL: "info"
          MAX_CONNECTIONS: "100"
          FEATURE_FLAG_ANALYTICS: "true"
          SERVER_PORT: "8080"
      - name: sample-service-config
        labels:
          app.kubernetes.io/part-of: cka-lab
          cka.practice/scenario: configmaps
        data:
          application.properties: |
            server.port=8080
            logging.level.root=INFO
            spring.datasource.hikari.maximum-pool-size=20
            management.endpoints.web.exposure.include=health,info,metrics
          nginx.conf: |
            server {
                listen 80;
                server_name sample.default.svc.cluster.local;
                location / {
                    proxy_pass http://localhost:8080;
                }
            }
      - name: sample-system-config
        immutable: true
        labels:
          app.kubernetes.io/part-of: cka-lab
          cka.practice/scenario: configmaps
        data:
          cluster_id: "homelab-preprod-01"
          region: "eu-west-home"
          dns_domain: "cluster.local"
          static_routing_mode: "direct"
  - namespace: "{{ cka_lab_configmaps_dev_namespace }}"
    configmaps:
      - name: dev-app-config
        labels:
          app.kubernetes.io/part-of: cka-lab
          cka.practice/scenario: configmaps
          environment: "{{ cka_lab_configmaps_dev_namespace }}"
        data:
          APP_ENV: "development"
          LOG_LEVEL: "debug"
          MAX_CONNECTIONS: "20"
          FEATURE_FLAG_DEBUG_BAR: "true"
          DEV_HOT_RELOAD: "enabled"
          SERVER_PORT: "3000"
      - name: dev-service-config
        labels:
          app.kubernetes.io/part-of: cka-lab
          cka.practice/scenario: configmaps
          environment: "{{ cka_lab_configmaps_dev_namespace }}"
        data:
          application-dev.properties: |
            server.port=3000
            logging.level.root=DEBUG
            spring.datasource.hikari.maximum-pool-size=5
            management.endpoints.web.exposure.include=*
            dev.mock.services=true
          nginx-dev.conf: |
            server {
                listen 80;
                server_name dev.development.svc.cluster.local;
                location / {
                    proxy_pass http://localhost:3000;
                }
            }
      - name: dev-system-config
        immutable: true
        labels:
          app.kubernetes.io/part-of: cka-lab
          cka.practice/scenario: configmaps
          environment: "{{ cka_lab_configmaps_dev_namespace }}"
        data:
          environment: "development"
          sandbox_mode: "permissive"
          debug_profiling: "enabled"
          mock_upstream_endpoint: "http://wiremock.development.svc.cluster.local:8080"

# Scenario: helm (Helm Monitoring & Addon Drill)
# Reference: https://helm.sh/docs/ and https://github.com/prometheus-operator/kube-prometheus
cka_lab_helm_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/helm"
cka_lab_helm_monitoring_namespace: "monitoring"
cka_lab_helm_metrics_server_chart_version: ""
cka_lab_helm_kube_prometheus_chart_version: ""
cka_lab_helm_ngf_release_name: "ngf"
cka_lab_helm_ngf_namespace: "nginx-gateway"
cka_lab_helm_ngf_chart_version: ""
cka_lab_helm_ngf_service_type: "NodePort"
cka_lab_helm_ngf_http_port: 30080
cka_lab_helm_ngf_https_port: 30443
cka_lab_helm_httpbingo_release_name: "httpbingo"
cka_lab_helm_httpbingo_namespace: "default"
cka_lab_helm_httpbingo_chart_version: ""
cka_lab_helm_httpbingo_service_type: "ClusterIP"
cka_lab_helm_httpbingo_cpu_request: "10m"
cka_lab_helm_httpbingo_memory_request: "16Mi"
cka_lab_helm_httpbingo_cpu_limit: "100m"
cka_lab_helm_httpbingo_memory_limit: "64Mi"

# Scenario: volumes (NFS Server & CKA Volume Drills)
# Reference: https://kubernetes.io/docs/concepts/storage/
cka_lab_volumes_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/volumes"
cka_lab_nfs_server_hostname: "nfs-server.local"
cka_lab_nfs_server_ip: >-
  {{
    hostvars[groups['control_plane'][0]]['node_ip']
    | default(hostvars[groups['control_plane'][0]]['ansible_host']
    | default('192.168.56.10'))
  }}
cka_lab_nfs_export_dir: "/srv/nfsroot"
cka_lab_nfs_export_subnet: "{{ '192.168.56.0/24' if ('preprod' in groups) else '10.0.0.0/8' }}"
cka_lab_nfs_export_options: "rw,sync,no_subtree_check,no_root_squash,insecure"
cka_lab_rbd_storage_class: "{{ rook_ceph_storage_class_name | default('rook-ceph-block') }}"
cka_lab_rbd_namespace: "{{ rook_ceph_namespace | default('rook-ceph') }}"
cka_lab_rbd_pool_name: "{{ rook_ceph_pool_name | default('replicapool') }}"
cka_lab_iscsi_portal: "{{ cka_lab_nfs_server_ip }}:3260"
cka_lab_iscsi_iqn: "iqn.2026-10.xyz.os76:storage.target01"
cka_lab_iscsi_fs_lun: 1
cka_lab_iscsi_block_lun: 2

# Scenario: deployments (Deployments, ReplicaSets, Rollouts, and Strategy Drills)
cka_lab_deployments_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/deployments"
cka_lab_deployments_namespace: "default"

# Scenario: pods (Pods, Namespaces, Lifecycle, and Immutability Drills)
# Reference: Kubernetes Pods and Namespaces CKA curriculum
cka_lab_pods_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/pods"
cka_lab_pods_namespace: "default"
cka_lab_pods_staging_namespace: "cka-lab-staging"

# Scenario: networking (Services, Ingress, Gateway API, and Network Policies)
# Reference: Kubernetes Services & Networking CKA curriculum
cka_lab_networking_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/networking"
cka_lab_networking_namespace: "default"
cka_lab_networking_gateway_namespace: "nginx-gateway"
cka_lab_networking_client_namespace: "cka-lab-net-client"
cka_lab_networking_backend_namespace: "cka-lab-net-backend"
cka_lab_networking_domain: "cka-lab.example.local"

# Scenario: scheduling (Taints, Tolerations, Affinities, HPA, and Resource Quotas)
cka_lab_scheduling_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/scheduling"
cka_lab_scheduling_namespace: "default"
cka_lab_scheduling_capacity_namespace: "cka-lab-capacity-ns"

# Scenario: workloads_advanced (DaemonSets, Batch Jobs, CronJobs, and Sidecars)
cka_lab_workloads_advanced_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/workloads-advanced"
cka_lab_workloads_advanced_namespace: "default"

# Scenario: storage_classes (Dynamic StorageClasses, Binding Modes, and PVC Expansion)
cka_lab_storage_classes_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/storage-classes"
cka_lab_storage_classes_namespace: "default"

# Scenario: cluster_troubleshooting (Cordon/Drain, Static Pod Recovery, Kubelet Diagnostics)
cka_lab_cluster_troubleshooting_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/cluster-troubleshooting"

# Scenario: crds (CustomResourceDefinitions and OpenAPI Schema Validation)
cka_lab_crds_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/crds-operators"
cka_lab_crds_namespace: "default"

# Scenario: chaos_troubleshooting (LitmusChaos Dynamic Resilience & Runtime Diagnostics)
cka_lab_chaos_troubleshooting_dir: "/home/{{ ansible_user | default('vagrant') }}/cka/chaos-troubleshooting"
cka_lab_chaos_namespace: "cka-troubleshooting"
cka_lab_litmus_operator_version: "v3.0.0"
