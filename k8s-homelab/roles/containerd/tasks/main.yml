---
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags:
    - cri
    - containerd

- name: Remove conflicting or legacy Docker keyrings and repository lists
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/docker.gpg
    - /etc/apt/sources.list.d/docker.list
  tags:
    - cri
    - containerd

- name: Download Docker GPG key for containerd
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  tags:
    - cri
    - containerd

- name: Add Docker apt repository for containerd
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker
  tags:
    - cri
    - containerd

- name: Install containerd.io
  ansible.builtin.apt:
    name: containerd.io
    state: present
    update_cache: true
  tags:
    - cri
    - containerd

- name: Ensure /etc/containerd directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'
  tags:
    - cri
    - containerd

- name: Check if /etc/containerd/config.toml exists
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: containerd_config_stat
  tags:
    - cri
    - containerd

- name: Generate default containerd config if missing
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  when: not containerd_config_stat.stat.exists
  changed_when: true
  notify: Restart containerd
  tags:
    - cri
    - containerd

- name: Configure SystemdCgroup in containerd config.toml
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup\s*=\s*false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd
  tags:
    - cri
    - containerd

- name: Ensure /opt/cni/bin directory exists
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    mode: '0755'
  tags:
    - cri
    - containerd

- name: Download standard CNI plugins
  ansible.builtin.unarchive:
    src: >-
      https://github.com/containernetworking/plugins/releases/download/{{
      cni_plugins_version }}/cni-plugins-linux-{{
      'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}-{{
      cni_plugins_version }}.tgz
    dest: /opt/cni/bin
    remote_src: true
    creates: /opt/cni/bin/loopback
  notify: Restart containerd
  tags:
    - cri
    - containerd

- name: Ensure containerd service is enabled and started
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
  tags:
    - cri
    - containerd

- name: Configure crictl endpoints in /etc/crictl.yaml
  ansible.builtin.template:
    src: crictl.yaml.j2
    dest: /etc/crictl.yaml
    owner: root
    group: root
    mode: '0644'
  tags:
    - cri
    - containerd
    - crictl
