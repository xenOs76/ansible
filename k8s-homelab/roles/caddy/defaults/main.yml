---
# ==============================================================================
# Role Defaults: Caddy Ingress Reverse Proxy
# ==============================================================================

# Caddy & xcaddy release versions
caddy_version: "v2.11.4"
caddy_xcaddy_version: "v0.4.4"
caddy_dns_plugin: "github.com/caddy-dns/powerdns@v1.0.2"
caddy_check_upstream_release: true
caddy_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

# Domain settings (preprod defaults to k8s-pre.os76.xyz; prod to k8s.os76.xyz)
caddy_domain_suffix: "{{ 'k8s-pre.os76.xyz' if ('preprod' in groups) else 'k8s.os76.xyz' }}"
caddy_domains:
  - "*.{{ caddy_domain_suffix }}"
  - "{{ caddy_domain_suffix }}"

# Reverse proxy backend settings (points to NodePort 30443 on worker nodes)
caddy_upstream_port: 30443
caddy_upstream_nodes: []  # Defaults to IPs from groups['workers'] or groups['k8s_cluster']
caddy_backend_tls: true
caddy_backend_tls_insecure: true

# PowerDNS API configuration for DNS-01 ACME challenge
caddy_sops_secrets_file: >-
  {{ playbook_dir ~ '/../secrets.sops.yaml' if (playbook_dir ~ '/../secrets.sops.yaml') is file else (playbook_dir ~ '/secrets.sops.yaml') }}
caddy_powerdns_server_url: >-
  {{
    (lookup('community.sops.sops', caddy_sops_secrets_file, errors='ignore') | default('{}', true) | from_yaml).caddy_powerdns_server_url
    | default((lookup('community.sops.sops', caddy_sops_secrets_file, errors='ignore') | default('{}', true) | from_yaml).caddy_powerdns_api_url
    | default(lookup('ansible.builtin.env', 'POWERDNS_SERVER_URL') | default('http://192.168.1.1:8081', true)))
  }}
caddy_powerdns_api_token: >-
  {{
    (lookup('community.sops.sops', caddy_sops_secrets_file, errors='ignore') | default('{}', true) | from_yaml).caddy_powerdns_api_token
    | default(lookup('ansible.builtin.env', 'POWERDNS_API_TOKEN') | default('', true))
  }}

# Garage S3 binary cache settings (retrieves prebuilt binary if present, saves if built)
caddy_s3_cache_enabled: true
caddy_s3_cache_upload: true
caddy_garage_endpoint: "https://garage-s3.0.os76.xyz"
caddy_garage_region: "garage"
caddy_garage_bucket: "os76-assets"
caddy_s3_object_key: "caddy/{{ caddy_version }}/caddy-powerdns-linux-{{ caddy_arch }}"
caddy_garage_access_key: >-
  {{
    (lookup('community.sops.sops', caddy_sops_secrets_file, errors='ignore') | default('{}', true) | from_yaml).caddy_garage_access_key
    | default(lookup('ansible.builtin.env', 'GARAGE_ACCESS_KEY') | default(lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') | default('', true)))
  }}
caddy_garage_secret_key: >-
  {{
    (lookup('community.sops.sops', caddy_sops_secrets_file, errors='ignore') | default('{}', true) | from_yaml).caddy_garage_secret_key
    | default(lookup('ansible.builtin.env', 'GARAGE_SECRET_KEY') | default(lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') | default('', true)))
  }}

# Let's Encrypt / ACME settings
caddy_acme_email: ""
caddy_acme_ca: ""  # Set e.g. to https://acme-staging-v02.api.letsencrypt.org/directory for staging

# User and paths
caddy_user: "caddy"
caddy_group: "caddy"
caddy_bin_path: "/usr/local/bin/caddy"
caddy_xcaddy_bin_path: "/usr/local/bin/xcaddy"
caddy_config_dir: "/etc/caddy"
caddy_data_dir: "/var/lib/caddy"
caddy_log_dir: "/var/log/caddy"
caddy_build_dir: "/var/cache/caddy-build"

# OS76 custom tooling repository
caddy_os76_apt_repo_enabled: "{{ os76_apt_repo_enabled | default(true) }}"
caddy_os76_apt_repo: "{{ os76_apt_repo | default('deb [trusted=yes] https://repo.os76.xyz/apt stable main') }}"

# Caddy status test script settings
caddy_test_script_user: "{{ ansible_user | default('vagrant') }}"
caddy_test_script_dir: "/home/{{ caddy_test_script_user }}"
caddy_test_script_name: "check-caddy-status.sh"
