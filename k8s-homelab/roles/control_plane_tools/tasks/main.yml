---
- name: Install Helm CLI via official APT repository
  ansible.builtin.include_tasks: helm.yml
  tags:
    - bootstrap
    - tools
    - helm

- name: Install k9s CLI package
  ansible.builtin.include_tasks: k9s.yml
  tags:
    - bootstrap
    - tools
    - k9s

- name: Install etcdctl and etcdutl CLI tools
  ansible.builtin.include_tasks: etcd_tools.yml
  tags:
    - bootstrap
    - tools
    - etcd

- name: Install glow Markdown CLI viewer
  ansible.builtin.include_tasks: glow.yml
  tags:
    - bootstrap
    - tools
    - glow

- name: Install krew kubectl plugin manager
  ansible.builtin.include_tasks: krew.yml
  tags:
    - bootstrap
    - tools
    - krew

- name: Install kubectl-cyclonus NetworkPolicy analysis tool
  ansible.builtin.include_tasks: cyclonus.yml
  tags:
    - bootstrap
    - tools
    - cyclonus
