---
- name: Deploy kube-metrics Helm installer script
  ansible.builtin.copy:
    src: install-kube-metrics.sh
    dest: "{{ control_plane_tools_script_dest }}"
    owner: "{{ control_plane_tools_user }}"
    group: "{{ control_plane_tools_user }}"
    mode: "0755"
  tags:
    - bootstrap
    - tools
    - metrics
