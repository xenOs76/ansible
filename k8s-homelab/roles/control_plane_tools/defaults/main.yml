---
control_plane_tools_k9s_version: "{{ k9s_version | default('v0.40.10') }}"
control_plane_tools_helm_apt_repo: >-
  {{ helm_apt_repo | default('deb [signed-by=/etc/apt/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main') }}
control_plane_tools_helm_apt_key_url: "{{ helm_apt_key_url | default('https://packages.buildkite.com/helm-linux/helm-debian/gpgkey') }}"
control_plane_tools_user: "{{ ansible_user | default('vagrant') }}"
control_plane_tools_script_dest: >-
  {{ install_kube_metrics_script_dest | default('/home/' ~ control_plane_tools_user ~ '/install-kube-metrics.sh') }}
