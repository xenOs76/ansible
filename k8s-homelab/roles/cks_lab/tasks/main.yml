---
- name: Ensure CKS lab workspace directory exists
  ansible.builtin.file:
    path: "{{ cks_lab_workspace_dir }}"
    state: directory
    owner: "{{ cks_lab_user }}"
    group: "{{ cks_lab_user }}"
    mode: "0755"
  tags:
    - cks_lab
    - tools

- name: Execute CKS Lab Scenario - MOTD Quick Reference (motd)
  ansible.builtin.include_tasks: scenario_motd.yml
  when: cks_lab_scenario_motd_enabled | bool
  tags:
    - cks_lab
    - motd

- name: Execute CKS Lab Scenario - Tooling Provisioning (tools)
  ansible.builtin.include_tasks: scenario_tools.yml
  when: cks_lab_scenario_tools_enabled | bool
  tags:
    - cks_lab
    - tools

- name: Execute CKS Lab Scenario - Control Plane Security Directories (audit_logs, etcd_enc, admission)
  ansible.builtin.include_tasks: scenario_audit_etcd.yml
  when: (cks_lab_scenario_audit_logs_enabled | bool) or (cks_lab_scenario_etcd_enc_enabled | bool) or (cks_lab_scenario_admission_enabled | bool)
  tags:
    - cks_lab
    - audit_logs
    - etcd_enc
    - admission

- name: Execute CKS Lab Scenario - gVisor Container Sandboxing (gvisor)
  ansible.builtin.include_tasks: scenario_gvisor.yml
  when: cks_lab_scenario_gvisor_enabled | bool
  tags:
    - cks_lab
    - gvisor

- name: Execute CKS Lab Scenario - Falco Runtime Intrusion Detection (falco)
  ansible.builtin.include_tasks: scenario_falco.yml
  when: cks_lab_scenario_falco_enabled | bool
  tags:
    - cks_lab
    - falco

- name: Execute CKS Lab Scenario - System Hardening (system)
  ansible.builtin.include_tasks: scenario_system_hardening.yml
  when: cks_lab_scenario_system_hardening_enabled | bool
  tags:
    - cks_lab
    - system
    - system_hardening

- name: Execute CKS Lab Scenario - AppArmor Kernel Profiles (apparmor)
  ansible.builtin.include_tasks: scenario_apparmor.yml
  when: cks_lab_scenario_apparmor_enabled | bool
  tags:
    - cks_lab
    - apparmor

- name: Execute CKS Lab Scenario - Seccomp Syscall Filtering (seccomp)
  ansible.builtin.include_tasks: scenario_seccomp.yml
  when: cks_lab_scenario_seccomp_enabled | bool
  tags:
    - cks_lab
    - seccomp

- name: Execute CKS Lab Scenario - Network Policies & Pod Microsegmentation (netpol)
  ansible.builtin.include_tasks: scenario_network_policy.yml
  when: cks_lab_scenario_netpol_enabled | bool
  tags:
    - cks_lab
    - netpol
    - network_policy
    - microservices

- name: Execute CKS Lab Addon - Trivy Operator (trivy_operator)
  ansible.builtin.include_tasks: addon_trivy_operator.yml
  when: cks_lab_trivy_operator_enabled | bool
  tags:
    - cks_lab
    - trivy_operator
    - cks_addons

- name: Execute CKS Lab Addon - Cilium Hubble UI (hubble_ui)
  ansible.builtin.include_tasks: addon_hubble_ui.yml
  when: cks_lab_hubble_ui_enabled | bool
  tags:
    - cks_lab
    - hubble_ui
    - cks_addons
