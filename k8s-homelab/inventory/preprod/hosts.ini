[control_plane]
kube-control-plane ansible_host=192.168.56.10 node_ip=192.168.56.10

[workers]
kube-worker-1 ansible_host=192.168.56.21 node_ip=192.168.56.21

[k8s_cluster:children]
control_plane
workers

[preprod:children]
k8s_cluster

[k8s_cluster:vars]
ansible_user=vagrant
ansible_ssh_private_key_file="{{ inventory_dir }}/../../.vagrant/machines/{{ inventory_hostname }}/libvirt/private_key"
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes'
ansible_python_interpreter=/usr/bin/python3
