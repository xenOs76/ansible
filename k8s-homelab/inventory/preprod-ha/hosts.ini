[control_plane]
kube-cp-1 ansible_host=192.168.56.10 node_ip=192.168.56.10 ansible_ssh_private_key_file="{{ inventory_dir }}/../../.vagrant/machines/kube-cp-1/libvirt/private_key"
kube-cp-2 ansible_host=192.168.56.11 node_ip=192.168.56.11 ansible_ssh_private_key_file="{{ inventory_dir }}/../../.vagrant/machines/kube-cp-2/libvirt/private_key"
kube-cp-3 ansible_host=192.168.56.12 node_ip=192.168.56.12 ansible_ssh_private_key_file="{{ inventory_dir }}/../../.vagrant/machines/kube-cp-3/libvirt/private_key"

[workers]
kube-worker-1 ansible_host=192.168.56.21 node_ip=192.168.56.21 ansible_ssh_private_key_file="{{ inventory_dir }}/../../.vagrant/machines/kube-worker-1/libvirt/private_key"

[k8s_cluster:children]
control_plane
workers

[preprod:children]
k8s_cluster

[preprod_ha:children]
k8s_cluster

[k8s_cluster:vars]
ansible_user=vagrant
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes'
ansible_python_interpreter=/usr/bin/python3
environment_name=preprod-ha
ha_control_plane_enabled=true
ha_control_plane_vip=192.168.56.9
ha_control_plane_port=8443
