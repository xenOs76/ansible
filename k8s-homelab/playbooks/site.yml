---
- name: 0. Announce playbook automation suite version
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Display playbook version
      ansible.builtin.debug:
        msg: "=== k8s-homelab automation suite v{{ playbook_version | default('1.1.0') }} ==="

- name: 1. Bootstrap common prerequisites, containerd, and kubernetes packages
  hosts: k8s_cluster
  become: true
  roles:
    - role: common
    - role: containerd
    - role: kubernetes_packages

- name: 2. Bootstrap control plane tooling (Helm APT, k9s .deb, metrics installer)
  hosts: control_plane
  become: true
  roles:
    - role: control_plane_tools
  tags:
    - bootstrap
    - tools

- name: 3. Initialize Kubernetes control plane
  hosts: control_plane
  become: true
  roles:
    - role: control_plane

- name: 4. Join worker nodes to cluster
  hosts: workers
  become: true
  roles:
    - role: worker

- name: 5. Deploy Cilium CNI and verify node readiness
  hosts: control_plane
  become: true
  roles:
    - role: cilium

- name: 6. Display final cluster status
  hosts: control_plane
  become: true
  tasks:
    - name: Fetch cluster nodes overview
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cluster_nodes
      changed_when: false
      tags:
        - verify

    - name: Fetch cluster pods overview
      ansible.builtin.command: kubectl get pods -A -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cluster_pods
      changed_when: false
      tags:
        - verify

    - name: Print cluster nodes summary
      ansible.builtin.debug:
        msg: "{{ cluster_nodes.stdout_lines }}"
      tags:
        - verify

    - name: Print cluster pods summary
      ansible.builtin.debug:
        msg: "{{ cluster_pods.stdout_lines }}"
      tags:
        - verify

    - name: Fetch admin.conf to local workstation controller
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/../admin.conf"
        flat: true
      run_once: true
      tags:
        - sync_kubeconfig
        - kubeconfig

    - name: Synchronize Kubernetes credentials to local client machine
      ansible.builtin.command:
        cmd: >-
          {{ playbook_dir }}/../scripts/sync-kubeconfig.sh
          -e {{ environment_name | default('preprod') }}
      delegate_to: localhost
      run_once: true
      become: false
      environment:
        CONTEXT_NAME: "{{ k8s_context_name | default('k8s-homelab') }}"
        CLUSTER_NAME: "{{ k8s_cluster_name | default('k8s-homelab') }}"
        USER_NAME: "{{ k8s_user_name | default('k8s-homelab-admin') }}"
      changed_when: true
      tags:
        - sync_kubeconfig
        - kubeconfig
