---
- name: Ensure HAProxy and Keepalived are configured on HA topology
  hosts: control_plane
  become: true
  roles:
    - role: ha_control_plane
      when: ha_control_plane_enabled | default(false) | bool
  tags:
    - ha
    - ha_control_plane

- name: Prepare CKA Inter-Node Resolution
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Ensure all Kubernetes cluster nodes are in /etc/hosts for CKA training
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^.*(\s+){{ item }}(\s*)$'
        line: "{{ hostvars[item]['node_ip'] | default(hostvars[item]['ansible_host']) }} {{ item }}"
        state: present
      loop: "{{ groups['k8s_cluster'] }}"
      when: groups['k8s_cluster'] is defined
  tags:
    - cka_lab
    - training
    - cka_ssh

- name: Deploy CKA Training Lab Scenarios and Tooling
  hosts: control_plane[0]
  become: true
  roles:
    - role: control_plane_tools
    - role: cka_lab
  tags:
    - cka_lab
    - training
