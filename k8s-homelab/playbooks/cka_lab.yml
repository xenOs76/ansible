---
- name: Prepare cluster nodes for CKA storage scenarios
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Ensure nfs-common package is installed on all cluster nodes
      ansible.builtin.apt:
        name: nfs-common
        state: present
      tags:
        - cka_lab
        - volumes
        - nfs

    - name: Ensure nfs-server.local DNS mapping exists in /etc/hosts on all nodes
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '.*(\s+)nfs-server\.local(\s*)$'
        line: >-
          {{
            hostvars[groups['control_plane'][0]]['node_ip']
            | default(hostvars[groups['control_plane'][0]]['ansible_host']
            | default('192.168.56.10'))
          }} nfs-server.local
        state: present
      tags:
        - cka_lab
        - volumes
        - nfs

- name: Deploy CKA Training Lab Scenarios
  hosts: control_plane
  become: true
  roles:
    - role: cka_lab
  tags:
    - cka_lab
    - training
