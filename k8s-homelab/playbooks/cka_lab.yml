---
- name: Ensure HAProxy and Keepalived are configured on HA topology
  hosts: control_plane
  become: true
  roles:
    - role: ha_control_plane
      when: ha_control_plane_enabled | default(false) | bool
  tags:
    - ha
    - ha_control_plane

- name: Deploy CKA Training Lab Scenarios
  hosts: control_plane
  become: true
  roles:
    - role: cka_lab
  tags:
    - cka_lab
    - training
