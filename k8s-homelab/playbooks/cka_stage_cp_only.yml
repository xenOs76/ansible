---
# ==============================================================================
# CKA Lab Provisioning Stage 2: Single Control Plane Online
# Initializes control plane with kubeadm init, installs Cilium CNI, and syncs
# kubeconfig. Worker nodes are prepared with containerd and kubeadm packages
# but left unjoined.
# Ideal for practicing worker joins, discovery hashes, tokens, and CNI checks.
# ==============================================================================
- name: 0. Announce CKA Stage 2 (Single Control Plane Online)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Display Stage 2 announcement
      ansible.builtin.debug:
        msg: "=== CKA Staging: Stage 2 (Control Plane Online with Cilium, Workers Unjoined) ==="

- name: 1. Ensure pre-bootstrap environment is present across all nodes
  ansible.builtin.import_playbook: cka_stage_prebootstrap.yml

- name: 2. Initialize Kubernetes control plane
  hosts: control_plane
  become: true
  roles:
    - role: control_plane

- name: 3. Deploy Cilium CNI
  hosts: control_plane
  become: true
  roles:
    - role: cilium

- name: 4. Synchronize Kubernetes credentials to local workstation
  hosts: control_plane
  become: true
  tasks:
    - name: Fetch admin.conf to local workstation controller
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/../admin.conf"
        flat: true
      run_once: true

    - name: Synchronize Kubernetes credentials to local client machine
      ansible.builtin.command:
        cmd: >-
          {{ playbook_dir }}/../scripts/sync-kubeconfig.sh
          -e {{ environment_name | default('preprod') }}
      delegate_to: localhost
      run_once: true
      become: false
      environment:
        CONTEXT_NAME: "{{ k8s_context_name | default('k8s-homelab') }}"
        CLUSTER_NAME: "{{ k8s_cluster_name | default('k8s-homelab') }}"
        USER_NAME: "{{ k8s_user_name | default('k8s-homelab-admin') }}"
      changed_when: true
