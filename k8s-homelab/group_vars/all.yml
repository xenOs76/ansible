---
# Playbook suite version
playbook_version: "1.2.0"

# Kubernetes versions and repositories
k8s_version: "1.34.1-1.1"
k8s_version_major_minor: "v1.34"

# Cluster networking
pod_network_cidr: "10.1.0.0/16"
cluster_name: "k8s-homelab"

# Kubernetes context and credential naming for local client sync
k8s_context_name: "k8s-homelab"
k8s_user_name: "k8s-homelab-admin"

# Container runtime (CRI)
container_runtime: "containerd"
cri_socket: "unix:///run/containerd/containerd.sock"
cni_plugins_version: "v1.6.0"

# CNI (Cilium)
cni_type: "cilium"
cilium_cli_version: "v0.16.24"
cilium_install_extra_args: ""

# User config for kubeconfig setup
cluster_admin_users:
  - root
  - "{{ ansible_user | default('vagrant') }}"

# OS76 Custom APT Repository (kubectl-netdrill, etc.)
os76_apt_repo_enabled: true
os76_apt_repo: "deb [trusted=yes] https://repo.os76.xyz/apt stable main"
os76_apt_packages:
  - kubectl-netdrill

# Control plane bootstrap tooling (Helm, k9s, kube-metrics installer)
k9s_version: "v0.40.10"
helm_apt_repo: "deb [signed-by=/etc/apt/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
helm_apt_key_url: "https://packages.buildkite.com/helm-linux/helm-debian/gpgkey"
helm_apt_key_fingerprint: "DDF78C3E6EBB2D2CC223C95C62BA89D07698DBC6"  # gitleaks:allow
install_kube_metrics_script_dest: "/home/{{ ansible_user | default('vagrant') }}/install-kube-metrics.sh"
