---
# Playbook suite version
playbook_version: "1.5.1"

# Kubernetes versions and repositories (Base: v1.36, Target Upgrade: v1.37)
k8s_version: "1.36.0-1.1"
k8s_version_major_minor: "v1.36"
k8s_upgrade_target_version: "1.37.0-1.1"
k8s_upgrade_target_version_major_minor: "v1.37"

# High-Availability Control Plane endpoint settings
ha_control_plane_enabled: false
ha_control_plane_vip: "192.168.56.9"
ha_control_plane_port: 8443
ha_control_plane_metrics_port: 8405


# Cluster networking
pod_network_cidr: "10.1.0.0/16"
cluster_name: "k8s-homelab"

# Kubernetes context and credential naming for local client sync
k8s_context_name: "k8s-homelab"
k8s_user_name: "k8s-homelab-admin"

# Container runtime (CRI)
container_runtime: "containerd"
cri_socket: "unix:///run/containerd/containerd.sock"
cni_plugins_version: "v1.6.0"

# CNI (Cilium)
cni_type: "cilium"
cilium_cli_version: "v0.16.24"
cilium_install_extra_args: ""

# User config for kubeconfig setup
cluster_admin_users:
  - root
  - "{{ ansible_user | default('vagrant') }}"

# Default system editor configuration
default_editor: "vim"
default_editor_path: "/usr/bin/vim.basic"

# OS76 Custom APT Repository (kubectl-netdrill, https-wrench, etc.)
os76_apt_repo_enabled: true
os76_apt_repo: "deb [trusted=yes] https://repo.os76.xyz/apt stable main"
os76_apt_packages:
  - kubectl-netdrill
  - https-wrench

# Control plane bootstrap tooling (Helm, k9s, etcdctl, etcdutl)
k9s_version: "v0.51.0"
k9s_skin: "nord"
helm_apt_repo: "deb [signed-by=/etc/apt/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
helm_apt_key_url: "https://packages.buildkite.com/helm-linux/helm-debian/gpgkey"
helm_apt_key_fingerprint: "DDF78C3E6EBB2D2CC223C95C62BA89D07698DBC6"  # gitleaks:allow

# Caddy ingress reverse proxy and DNS-01 ACME
caddy_version: "v2.11.7"
caddy_xcaddy_version: "v0.4.4"
caddy_dns_plugin: "github.com/caddy-dns/powerdns@v1.0.2"
caddy_check_upstream_release: true
caddy_domain_suffix: "{{ 'k8s-pre.os76.xyz' if ('preprod' in groups) else 'k8s.os76.xyz' }}"
caddy_domains:
  - "*.{{ caddy_domain_suffix }}"
  - "{{ caddy_domain_suffix }}"
caddy_upstream_port: 30443
caddy_backend_tls: true
caddy_backend_tls_insecure: true
caddy_sops_secrets_file: >-
  {{ playbook_dir ~ '/../secrets.sops.yaml' if (playbook_dir ~ '/../secrets.sops.yaml') is file else (playbook_dir ~ '/secrets.sops.yaml') }}
caddy_powerdns_server_url: >-
  {{
    (lookup('community.sops.sops', caddy_sops_secrets_file, errors='ignore') | default('{}', true) | from_yaml).caddy_powerdns_server_url
    | default((lookup('community.sops.sops', caddy_sops_secrets_file, errors='ignore') | default('{}', true) | from_yaml).caddy_powerdns_api_url
    | default(lookup('ansible.builtin.env', 'POWERDNS_SERVER_URL') | default('http://192.168.1.1:8081', true)))
  }}
caddy_powerdns_api_token: >-
  {{
    (lookup('community.sops.sops', caddy_sops_secrets_file, errors='ignore') | default('{}', true) | from_yaml).caddy_powerdns_api_token
    | default(lookup('ansible.builtin.env', 'POWERDNS_API_TOKEN') | default('', true))
  }}
caddy_acme_email: ""
caddy_acme_ca: ""
caddy_resolvers: >-
  {{
    (lookup('community.sops.sops', caddy_sops_secrets_file, errors='ignore') | default('{}', true) | from_yaml).caddy_resolvers
    | default(lookup('ansible.builtin.env', 'POWERDNS_RESOLVERS') | default('', true))
  }}

# Caddy Garage S3 binary cache settings (retrieves prebuilt binary if present, saves if built)
caddy_s3_cache_enabled: true
caddy_s3_cache_upload: true
caddy_garage_endpoint: "https://garage-s3.0.os76.xyz"
caddy_garage_region: "garage"
caddy_garage_bucket: "os76-assets"
caddy_s3_object_key: "caddy/{{ caddy_version }}/caddy-powerdns-linux-{{ caddy_arch }}"
caddy_garage_access_key: >-
  {{
    (lookup('community.sops.sops', caddy_sops_secrets_file, errors='ignore') | default('{}', true) | from_yaml).caddy_garage_access_key
    | default(lookup('ansible.builtin.env', 'GARAGE_ACCESS_KEY') | default(lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') | default('', true)))
  }}
caddy_garage_secret_key: >-
  {{
    (lookup('community.sops.sops', caddy_sops_secrets_file, errors='ignore') | default('{}', true) | from_yaml).caddy_garage_secret_key
    | default(lookup('ansible.builtin.env', 'GARAGE_SECRET_KEY') | default(lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') | default('', true)))
  }}
caddy_build_dir: "/var/cache/caddy-build"
# Storage provider selection ('kernel' for Linux nfs-kernel-server, 'ceph' for Rook CephNFS)
storage_nfs_provider: "kernel"

# Rook-Ceph storage orchestrator configuration (RBD block, CephFS filesystem, and CephNFS)
rook_ceph_enabled: true
rook_ceph_version: "v1.15.5"
rook_ceph_helm_repo: "https://charts.rook.io/release"
rook_ceph_namespace: "rook-ceph"
rook_ceph_cluster_name: "rook-ceph"
rook_ceph_image_version: "v19.2.1"

# RBD Block Storage configuration
rook_ceph_rbd_enabled: true
rook_ceph_storage_class_name: "rook-ceph-block"
rook_ceph_is_default_sc: true
rook_ceph_mon_count: 1
rook_ceph_mgr_count: 1
rook_ceph_pool_replicas: 1
rook_ceph_pool_name: "replicapool"
rook_ceph_failure_domain: "osd"
rook_ceph_fs_type: "ext4"

# CephFS Shared Filesystem configuration
rook_ceph_cephfs_enabled: true
rook_ceph_fs_name: "cephfs"
rook_ceph_fs_storage_class_name: "rook-cephfs"
rook_ceph_fs_pool_replicas: 1
rook_ceph_mds_count: 1
rook_ceph_csi_provisioner_replicas: 1

# CephNFS Server & Export configuration (drop-in alternative to nfs-kernel-server)
rook_ceph_nfs_enabled: "{{ (storage_nfs_provider | default('kernel')) == 'ceph' }}"
rook_ceph_nfs_cluster_id: "homelab-nfs"
rook_ceph_nfs_server_count: 1
rook_ceph_nfs_host_network: true
rook_ceph_nfs_export_path: "{{ nfs_export_dir | default('/exports') }}"
rook_ceph_nfs_client_subnets:
  - "{{ nfs_export_subnet | default('192.168.56.0/24') }}"
  - "{{ pod_network_cidr | default('10.1.0.0/16') }}"

# Rook Ceph Toolbox configuration
rook_ceph_toolbox_enabled: true

# NFS shared storage server configuration
nfs_server_enabled: true
nfs_server_hostname: "nfs-server.local"
nfs_export_dir: "/srv/nfsroot"
nfs_legacy_export_symlink: "/exports"
nfs_export_subnet: "{{ '192.168.56.0/24' if ('preprod' in groups) else (pod_network_cidr | default('10.0.0.0/8')) }}"
nfs_export_options: "rw,sync,no_subtree_check,no_root_squash,insecure,fsid=0"

# NFS CSI Driver Helm & in-cluster dynamic storage provisioning
nfs_csi_enabled: false
nfs_csi_helm_repo: "https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts"
nfs_csi_chart_version: "v4.9.0"
nfs_csi_namespace: "kube-system"
nfs_csi_storage_class_name: "nfs-csi"
nfs_csi_storage_class_default: false
nfs_csi_server: "{{ nfs_server_hostname | default('nfs-server.local') }}"
nfs_csi_share: "{{ nfs_export_dir | default('/srv/nfsroot') }}"
nfs_csi_reclaim_policy: "Delete"

# Fibre Channel (FC) SAN storage emulation configuration
fc_san_enabled: false
fc_san_storage_dir: "/srv/fc"
fc_san_target_wwnn: "20000025b5000001"
fc_san_target_wwns:
  - "5001438024266301" # Fabric A primary target WWPN
  - "5001438024266302" # Fabric B secondary target WWPN (multipath)
fc_san_luns:
  - id: 0
    name: "lun0.img"
    size: "512M"
    description: "Filesystem LUN (ext4) for Pod volume mounts"
  - id: 1
    name: "lun1.img"
    size: "512M"
    description: "Raw block LUN for Block volumeMode drills"
  - id: 2
    name: "lun2.img"
    size: "1024M"
    description: "Dynamic expansion and reclaim disaster recovery LUN"
